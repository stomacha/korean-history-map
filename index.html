<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국사 사건 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --panel: #fff; --soft: #f6f7f9;
    --accent: #e11d48; --radius: 10px;
  }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-columns: 0 1fr 380px; grid-template-rows: 100vh; font-family: 'Noto Sans KR', sans-serif; color: var(--ink); background: var(--soft); }
  body.country-open { grid-template-columns: 320px 1fr 380px; }
  #country { grid-column: 1; grid-row: 1; position: relative; overflow-y: auto; padding: 16px 20px 20px; background: var(--panel);
    border-right: 1px solid var(--line); font-size: 14px; line-height: 1.7; }
  body:not(.country-open) #country { display: none; }
  #country h2 { margin: 6px 40px 8px 0; font-size: 20px; }
  #country .c-img { display: block; width: 100%; max-height: 180px; object-fit: contain; margin-bottom: 10px; border-radius: var(--radius); background: var(--soft); }
  #country dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0 0 12px; font-size: 13px; }
  #country dt { color: var(--muted); }
  #country dd { margin: 0; }
  #country .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
  #country .sym, #country .note { padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  #country .close { position: absolute; top: 8px; right: 10px; width: 32px; height: 32px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.9); font-size: 22px; line-height: 1; cursor: pointer; }
  #country .close:hover { background: var(--line); }
  #main { grid-column: 2; grid-row: 1; position: relative; min-width: 0; }
  #map { height: 100%; background: #a6c8e8; font-family: inherit; }

  /* 오른쪽 사이드: 위 = 사건 설명, 아래 = 사건 유형 */
  #side { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; min-height: 0; height: 100vh; background: var(--panel); border-left: 1px solid var(--line); }
  #side header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  #side h1 { margin: 0; font-size: 18px; }
  #side header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  #detail { position: relative; flex: 1; overflow-y: auto; padding: 16px 20px 20px; font-size: 14px; line-height: 1.7; }
  #detail h2 { margin: 6px 0 4px; font-size: 20px; line-height: 1.4; }
  #close { position: absolute; top: 8px; right: 10px; width: 32px; height: 32px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.9); font-size: 22px; line-height: 1; cursor: pointer; z-index: 1; }
  #close:hover { background: var(--line); }
  figure { margin: 0 0 12px; }
  /* 세로로 긴 초상화도 잘리지 않게 contain */
  figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: var(--radius); background: var(--soft); }
  figcaption { margin-top: 4px; font-size: 11px; line-height: 1.5; color: var(--muted); }
  figcaption a { color: inherit; }
  .nophoto { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 6; margin-bottom: 12px;
    border: 1px dashed #c7cbd1; border-radius: var(--radius); background: var(--soft); color: var(--muted); font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px; border-radius: 999px; background: var(--soft); font-size: 12px; font-weight: 500; }
  .chip::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  #detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 10px 0 12px; font-size: 13px; }
  #detail dt { color: var(--muted); }
  #detail dd { margin: 0; }
  .flag { display: inline-block; padding: 0 8px; margin-right: 4px; border-radius: 4px; background: #fef3c7; color: #92400e; font-size: 12px; }
  .desc { margin: 0 0 16px; text-align: justify; }
  .src { padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.6; color: var(--muted); }
  .src b { color: var(--ink); font-weight: 500; }
  .intro { color: var(--muted); }
  .intro b { color: var(--ink); }

  #legend { padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--soft); }
  #legend h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; }
  #filters { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  #filters label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
  #filters input { margin: 0; accent-color: var(--ink); }
  #filters .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  #legend .note { margin: 8px 0 0; font-size: 11px; color: var(--muted); }
  #legend .terr-toggle { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; cursor: pointer; }
  /* 국가 영토 이름표 */
  .terr-label span { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; white-space: nowrap;
    font-size: 12px; font-weight: 700; color: #3a3a3a; letter-spacing: 1px; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .terr-label img { height: 16px; max-width: 26px; object-fit: contain; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
  /* 넓게 볼 때(줌 6 이하) 작게: 마커, 작은 도시 이름 숨김 */
  .zoomed-out .pin { width: 15px; height: 15px; border-width: 1.5px; }
  .zoomed-out .place.minor { display: none; }
  .terr-on .place.country { display: none; }
  #eras { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
  #eras button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #eras button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }

  /* 마커: 36px 클릭 영역 안에 22px 원 */
  .pin-wrap { display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-sizing: border-box;
    box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 1px 4px rgba(0,0,0,.35); transition: transform .15s; }
  .pin-wrap:hover .pin { transform: scale(1.3); }
  .selected .pin { box-shadow: 0 0 0 3px var(--accent), 0 2px 6px rgba(0,0,0,.4); transform: scale(1.35); }
  .leaflet-tooltip { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 6px; }

  /* 한글 지명 */
  .place { white-space: nowrap; font-size: 12px; color: #222; text-shadow: 0 0 3px #fff, 0 0 3px #fff; pointer-events: none; }
  .place.country { font-size: 18px; font-weight: 700; letter-spacing: 6px; color: #555; }
  .place.sea { font-size: 15px; font-style: italic; color: #1e4e8c; letter-spacing: 4px; }

  #timeline { position: absolute; z-index: 1000; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: min(640px, calc(100% - 32px)); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    background: rgba(255,255,255,.95); padding: 10px 14px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.25); font-size: 13px; }
  #slider { flex: 1; accent-color: var(--ink); }
  #play { flex-shrink: 0; width: 36px; height: 36px; border: none; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; cursor: pointer; }
  #info { white-space: nowrap; font-variant-numeric: tabular-nums; }

  @media (max-width: 760px) {
    html, body { height: auto; }
    body, body.country-open { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; }
    #country .c-img { max-height: 90px; }
    #country { grid-row: 1; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--line); }
    #main { grid-column: 1; grid-row: 2; }
    #side { grid-column: 1; grid-row: 3; }
    #side { height: auto; border-left: none; border-top: 1px solid var(--line); }
    #detail { max-height: 50vh; }
    #timeline { bottom: 20px; gap: 8px; padding: 8px 10px; }
    #slider { min-width: 0; }
    #info { font-size: 11px; white-space: normal; text-align: right; line-height: 1.3; }
  }
</style>
</head>
<body>
<aside id="country" aria-label="나라 설명"></aside>
<div id="main">
  <div id="map"></div>
  <div id="timeline">
    <div id="eras" aria-label="시대 분류"></div>
    <button id="play" title="재생">▶</button>
    <input id="slider" type="range" min="0" step="1" aria-label="연도">
    <span id="info"></span>
  </div>
</div>
<aside id="side">
  <header>
    <h1>한국사 사건 지도</h1>
    <p id="summary"></p>
  </header>
  <section id="detail"></section>
  <section id="legend">
    <h3>사건 유형</h3>
    <div id="filters"></div>
    <label class="terr-toggle"><input type="checkbox" id="showTerr" checked>그 시기 국가 영토 표시</label>
    <p class="note">연대 미상인 사건은 슬라이더와 관계없이 항상 표시됩니다. 영토 경계는 대략적이며, 색은 중국 왕조의 오덕(五德) 상징색·몽골의 흰색·대한제국의 황색을 따르고, 상징색이 없는 나라는 이름 옆에 상징물이나 국기를 붙였습니다.</p>
  </section>
</aside>
<script>
const CATS = { 신화: '#8b8b8b', 전쟁: '#2563eb', 내전: '#7c3aed', 반란: '#eab308', 사고: '#f97316', 기타: '#16a34a' };

// [분류, 사건, 연도(null=연대 미상), 장소, 추정 위치 여부, 위도, 경도, 설명, 출처('; '로 구분), 사진?([위키미디어 공용 파일명, 캡션, 저작자·라이선스])]
const EVENTS = [
  // 고조선·삼국
  ['신화', '단군의 고조선 건국', null, '아사달 (평양설)', true, 39.03, 125.77, '『삼국유사』에 따르면 하늘을 다스리던 환인의 아들 환웅이 태백산 신단수 아래로 내려와 신시를 열었고, 곰에서 사람이 된 웅녀와 혼인해 단군왕검을 낳았다. 단군왕검은 아사달에 도읍하여 조선(고조선)을 세웠다고 한다. 흔히 말하는 기원전 2333년은 후대 사서가 계산한 연대로, 역사적 사실로 확정할 수 없다. 아사달의 위치도 평양설과 요동설 등으로 갈린다.', '『삼국유사』 기이편 고조선조; 『제왕운기』', ["The Sacred Portrait of Dangun in Daejonggyo.jpg", "단군 영정 (대종교 공식 웹사이트 제공)", "대종교 / CC BY 4.0"]],
  ['전쟁', '왕검성 함락 (고조선 멸망)', '기원전 108년', '왕검성 (평양설)', true, 39.05, 125.72, '위만의 손자 우거왕 때 고조선은 한과 주변 나라 사이의 교역을 막으며 세력을 키웠다. 기원전 109년 한 무제는 수륙 양면으로 군대를 보냈으나 고조선은 1년 가까이 왕검성을 지켜냈다. 그러나 지배층 안에서 항복론이 일어나 우거왕이 살해되었고, 기원전 108년 왕검성이 함락되었다. 한은 그 땅에 낙랑·진번·임둔군을 두고 이듬해 현도군을 더 두었다.', '『사기』 조선열전; 『한서』 조선전', ["2016-10-16 Taedong River (Pyongyang).jpg", "평양 대동강 일대 (왕검성 평양설의 추정지) (추정되는 위치)", "Jan Bockaert / CC BY-SA 2.0"]],
  ['신화', '박혁거세의 신라 건국', '기원전 57년 (추정, 삼국사기 전승)', '서라벌 나정 (경주, 전승지)', true, 35.81, 129.22, '진한 땅 여섯 마을의 촌장들이 임금을 세우기로 했을 때, 양산 아래 나정 우물가에서 흰 말이 절하던 자리에 큰 알이 있었고 그 알에서 박혁거세가 태어났다고 한다. 열세 살에 왕으로 추대되어 나라 이름을 서나벌이라 했다. 『삼국사기』는 이를 기원전 57년으로 적고 있으나, 신라가 실제 국가로 자리 잡은 시기는 이보다 늦었다고 보는 견해가 많다.', '『삼국사기』 신라본기 시조 혁거세거서간; 『삼국유사』 기이편', ["초등대한역사 제2편 2.jpg", "박혁거세와 알영 (1908년 『초등대한역사』 삽화)", "정인호 『초등대한역사』(1908) / 퍼블릭 도메인"]],
  ['신화', '주몽의 고구려 건국', '기원전 37년 (추정, 삼국사기 전승)', '졸본 (환인 오녀산성설)', true, 41.32, 125.42, '부여 금와왕의 궁에서 자란 주몽은 하백의 딸 유화가 낳은 알에서 태어났다고 전한다. 활을 잘 쏘아 대소 등 부여 왕자들의 시기를 받자 남쪽으로 탈출했고, 졸본에 이르러 나라를 세웠다. 광개토대왕릉비에도 시조 추모왕의 건국 이야기가 새겨져 있다. 졸본은 중국 랴오닝성 환인의 오녀산성으로 보는 견해가 유력하다.', '『삼국사기』 고구려본기 시조 동명성왕; 광개토대왕릉비', ["Tomb of King Dongmyeong of Goguryeo in Pyongyang.jpg", "평양 동명왕릉 (동명성왕의 무덤으로 전해지는 곳) (대체 사진)", "mesosyn.com / CC BY-SA 4.0"]],
  ['신화', '온조의 백제 건국', '기원전 18년 (추정, 삼국사기 전승)', '위례성 (서울 풍납토성설)', true, 37.533, 127.12, '주몽의 아들 온조는 북부여에서 온 유리가 태자가 되자 형 비류와 함께 남쪽으로 내려왔다. 비류는 미추홀(인천)에, 온조는 하남 위례성에 자리 잡았는데, 미추홀은 땅이 습하고 물이 짜서 비류의 백성들이 결국 위례성으로 옮겨 왔다고 한다. 처음 나라 이름은 십제였다가 뒤에 백제로 바꾸었다. 하남 위례성은 서울 풍납토성으로 보는 견해가 유력하다.', '『삼국사기』 백제본기 시조 온조왕', ["Pungnap Toseong winter.jpg", "서울 풍납토성 (하남 위례성 추정지) (추정되는 위치)", "User:Asfreeas / CC BY 3.0"]],
  ["기타", "국내성 천도", "3년", "국내성 (지린성 지안)", false, 41.12, 126.17, "『삼국사기』에 따르면 고구려 유리왕 때 제사에 쓸 돼지가 달아나 이를 쫓아갔던 신하 설지가, 국내 위나암 땅은 산수가 험하고 땅이 기름져 사냥과 농사에 알맞다고 아뢰었다. 유리왕은 서기 3년 도읍을 졸본에서 국내로 옮기고 위나암성을 쌓았다. 국내성은 지금의 중국 지린성 지안 시내에 평지성의 성벽 일부가 남아 있으며, 위급할 때는 뒤쪽의 산성으로 들어가 방어했다. 427년 평양으로 옮길 때까지 400여 년간 고구려의 수도였으며, 국내성과 환도산성, 왕릉과 귀족 무덤은 2004년 유네스코 세계유산에 등재되었다.", "『삼국사기』 고구려본기 유리왕 21·22년", ["Southeast Corner Of Gungnae Fortress.jpg", "집안 국내성 성벽", "Prcshaw / CC BY-SA 4.0"]],
  ['신화', '김수로의 가야 건국', '42년 (추정, 삼국유사 전승)', '구지봉 (김해, 전승지)', true, 35.243, 128.876, '가야 지역 아홉 촌장과 백성들이 구지봉에 모여 "거북아 거북아 머리를 내어라"라는 구지가를 부르자 하늘에서 금빛 상자가 내려왔고, 그 안의 여섯 알에서 사내아이들이 태어났다고 한다. 가장 먼저 태어난 수로가 금관가야(가락국)의 왕이 되고, 나머지는 다른 다섯 가야의 왕이 되었다. 수로왕은 바다 건너 아유타국에서 온 허황옥을 왕비로 맞았다고 전한다.', '『삼국유사』 기이편 가락국기', ["김해 구지봉.jpg", "김해 구지봉 (수로왕 탄강 전승지) (대체 사진)", "국가유산청 / CC BY-SA 4.0"]],
  ['내전', '발기의 난', '197년', '국내성 일대 (집안)', true, 41.13, 126.19, '197년 고국천왕이 아들 없이 세상을 떠나자 왕비 우씨는 죽음을 알리지 않고 왕의 동생 연우를 찾아가 그를 왕(산상왕)으로 세웠다. 연우의 형 발기는 이에 반발해 왕궁을 포위했으나 따르는 이가 없자 요동의 공손도에게 가서 군사 3만을 빌려 고구려를 공격했다. 산상왕은 동생 계수를 보내 이를 물리쳤고, 발기는 배천에 이르러 스스로 목숨을 끊었다.', '『삼국사기』 고구려본기 산상왕', ["Hwando Mountain Fortress 2.jpg", "집안 환도산성 (산상왕 때 쌓은 고구려 산성) (대체 사진)", "Bart0278 / CC BY-SA 3.0"]],
  ['전쟁', '관구검의 환도성 함락', '244년 (추정, 삼국사기는 246년)', '환도성 (집안 산성자산성)', true, 41.16, 126.16, '고구려 동천왕이 242년 요동의 서안평을 공격하며 위나라를 압박하자, 위의 유주자사 관구검이 244년 고구려를 침공했다. 동천왕은 처음엔 이겼으나 결국 크게 패했고, 위군은 수도 환도성을 함락했다. 이듬해 다시 침입한 위군에 쫓겨 동천왕은 옥저 방면까지 피란했는데, 밀우와 유유의 활약으로 위기를 넘겼다. 『삼국사기』는 이 사건을 246년으로 기록한다.', '『삼국지』 위서 관구검전; 『삼국사기』 고구려본기 동천왕; 관구검기공비', ["Guanqiu Jian commemoration stele.jpg", "관구검기공비 탁본 (위나라의 고구려 원정을 새긴 비석)", "작자 미상 / 퍼블릭 도메인"]],
  ['전쟁', '평양성 전투 (고국원왕 전사)', '371년', '평양성', true, 38.99, 125.79, '4세기 후반 백제 근초고왕은 마한 지역을 아우르고 북쪽으로 세력을 넓혔다. 369년 고구려 고국원왕이 백제를 공격했다가 치양에서 패했고, 371년에는 근초고왕과 태자 근구수가 정예병 3만을 이끌고 평양성을 공격했다. 성을 지키던 고국원왕은 날아온 화살에 맞아 전사했다. 고구려는 이후 소수림왕 때 율령 반포와 불교 수용 등으로 체제를 정비했다. 당시 평양성이 지금의 평양인지에 대해서는 다른 견해도 있다.', '『삼국사기』 백제본기 근초고왕, 고구려본기 고국원왕', ["Man - Anak Tomb No. 3.jpg", "안악 3호분 벽화의 무덤 주인 (고국원왕릉설이 있는 고분) (대체 사진)", "작자 미상 / 퍼블릭 도메인"]],
  ["기타", "광개토대왕릉비 건립", "414년", "집안 (지린성 지안)", false, 41.15, 126.22, "장수왕은 아버지 광개토대왕의 공적을 기리기 위해 414년 높이 6.39m에 이르는 거대한 비석을 세웠다. 비석 네 면에는 1,700여 자의 한자가 새겨져 있으며, 추모왕(주몽)의 건국 신화와 광개토대왕이 백제·신라·가야·왜·부여 등을 상대로 벌인 정복 활동, 왕릉을 지키는 수묘인에 관한 규정이 담겨 있다. 오랫동안 잊혔다가 19세기 말 다시 알려졌고, 신묘년(391) 기사의 해석을 둘러싸고 한일 학계 사이에 논쟁이 이어져 왔다.", "광개토대왕릉비 비문; 『삼국사기』 고구려본기 장수왕", ["20230605 Stela for Gwanggaeto.jpg", "집안 광개토대왕릉비", "Yumeto / CC BY-SA 4.0"]],
  ["기타", "평양 천도", "427년", "평양 (안학궁·대성산성 일대)", true, 39.075, 125.81, "광개토대왕의 뒤를 이은 장수왕은 427년 도읍을 국내성에서 평양으로 옮겼다. 평양은 대동강 유역의 넓은 평야를 끼고 있어 경제 기반이 풍부했고, 남쪽으로 세력을 넓히는 데 유리했다. 천도 이후 고구려는 백제와 신라를 압박하는 남진 정책을 본격적으로 펼쳐 475년 백제의 한성을 함락했다. 천도 초기 왕궁은 대성산성과 안학궁 일대로 보는 견해가 많으나 안학궁의 축조 시기에는 논란이 있다. 고구려는 586년 다시 장안성(지금의 평양 시내)으로 도읍을 옮겼다.", "『삼국사기』 고구려본기 장수왕 15년", ["Anhakgung.jpg", "평양 안학궁 터 (장수왕 때 궁궐 터로 알려진 곳) (추정되는 위치)", "wikimapia / CC BY-SA 4.0"]],
  ['전쟁', '한성 함락', '475년', '한성 (서울 몽촌토성·풍납토성 일대)', false, 37.517, 127.115, '427년 평양으로 수도를 옮긴 장수왕은 남쪽으로 세력을 넓혔다. 475년 장수왕은 직접 3만 군사를 이끌고 백제를 공격해 7일 만에 북성을, 이어 남성을 함락했다. 성을 빠져나가던 개로왕은 붙잡혀 아차산성 아래에서 처형되었다. 백제는 문주왕이 웅진(공주)으로 수도를 옮기며 한강 유역을 잃었다.', '『삼국사기』 백제본기 개로왕, 고구려본기 장수왕', ["Seoul Mongchon Toseong-3.JPG", "서울 몽촌토성 (백제 한성의 왕성 터)", "Saigen Jiro / CC0"]],
  ["기타", "웅진 천도", "475년", "웅진 (공주 공산성)", false, 36.468, 127.13, "475년 고구려 장수왕의 공격으로 수도 한성이 함락되고 개로왕이 죽자, 아들 문주왕은 남쪽으로 내려가 웅진(공주)으로 도읍을 옮겼다. 웅진은 북쪽으로 금강이 흐르고 산으로 둘러싸여 방어에 유리했다. 그러나 천도 초기에는 귀족 세력의 다툼으로 왕이 잇따라 살해되는 등 정치가 불안했고, 동성왕과 무령왕 때에 이르러 나라가 안정되었다. 웅진 시기의 왕성으로 보는 공산성과 무령왕릉 등은 2015년 유네스코 세계유산(백제역사유적지구)에 등재되었다.", "『삼국사기』 백제본기 문주왕", ["Geumseoru Gate Pavilion of Gongsanseong Fortress (2).jpg", "공주 공산성 금서루", "Ashy Minivet / CC0"]],
  ['전쟁', '이사부의 우산국 정벌', '512년', '우산국 (울릉도)', false, 37.50, 130.87, '하슬라주 군주 이사부는 우산국 사람들이 험한 지형을 믿고 복종하지 않자 꾀를 냈다. 나무로 사자를 많이 만들어 배에 나누어 싣고 우산국 해안에 이르러, 항복하지 않으면 이 맹수를 풀어 밟아 죽이겠다고 위협했다. 겁을 먹은 우산국 사람들은 곧 항복하고 해마다 토산물을 바쳤다. 울릉도가 한국사 문헌에 처음 등장하는 기록이다.', '『삼국사기』 신라본기 지증마립간 13년, 이사부 열전', ["KOCIS Port Taeha, Ulleungdo (4925990346).jpg", "울릉도 태하 해안 (대체 사진)", "Korea.net / CC BY-SA 2.0"]],
  ['기타', '금관가야 항복', '532년', '금관가야 (김해)', false, 35.237, 128.873, '6세기 들어 신라와 백제의 압박을 받던 금관가야는 점차 세력을 잃었다. 532년 마지막 왕 김구해(구형왕)는 왕비와 세 아들을 데리고 신라에 항복했다. 법흥왕은 이들을 예우해 높은 관등을 주고 본국을 식읍으로 주었다. 구해왕의 막내아들 김무력은 뒤에 관산성 전투에서 공을 세웠고, 그의 손자가 삼국 통일의 주역 김유신이다.', '『삼국사기』 신라본기 법흥왕 19년; 『삼국유사』 가락국기', ["20230113 산청 전 구형왕릉-01.jpg", "산청 전 구형왕릉", "Ope8411 / CC BY-SA 4.0"]],
  ["기타", "사비 천도", "538년", "사비 (부여)", false, 36.2786, 126.9135, "백제 성왕은 538년 도읍을 웅진에서 사비(부여)로 옮기고 나라 이름을 남부여라 했다. 사비는 금강(백마강)이 감싸 흐르는 넓은 평야 지대로, 부소산성을 중심으로 도성을 계획적으로 쌓고 나성으로 둘렀다. 성왕은 중앙 관청을 22부로 정비하고 수도를 5부, 지방을 5방으로 나누는 등 체제를 정비했으며, 이를 바탕으로 한강 유역 회복에 나섰다. 사비는 660년 백제가 멸망할 때까지 120여 년간 도읍이었고, 도성 중심의 정림사지 오층석탑은 백제 석탑의 대표작이다.", "『삼국사기』 백제본기 성왕 16년; 『삼국유사』 남부여조", ["정림사지 오층석탑 정면.jpg", "부여 정림사지 오층석탑 (사비 도성 중심의 절터)", "문화재청 / 공공누리 제1유형"]],
  ['전쟁', '신라의 한강 하류 점령', '553년', '한강 하류 일대', true, 37.55, 126.85, '고구려의 남진에 맞서 신라와 백제는 433년부터 동맹을 맺었다(나제 동맹). 551년 두 나라는 함께 고구려를 공격해 백제는 한강 하류의 옛 땅을, 신라는 한강 상류를 차지했다. 그러나 553년 신라 진흥왕은 백제가 되찾은 한강 하류마저 빼앗고 이곳에 신주를 설치했다. 120년간 이어진 나제 동맹은 이로써 깨졌고, 신라는 서해를 통해 중국과 직접 교류할 수 있게 되었다.', '『삼국사기』 신라본기 진흥왕 14년, 백제본기 성왕 31년', ["북한산 신라 진흥왕 순수비.jpg", "북한산 신라 진흥왕 순수비", "National Museum of Korea / 공공누리 제1유형"]],
  ['전쟁', '관산성 전투', '554년', '관산성 (옥천 일대)', true, 36.30, 127.57, '한강 하류를 잃은 백제 성왕은 가야·왜와 연합해 554년 신라의 관산성을 공격했다. 태자 여창(뒤의 위덕왕)이 앞장서 싸우던 중, 아들을 격려하러 소수의 군사와 밤길을 가던 성왕이 신라 복병에게 붙잡혀 죽임을 당했다. 이어진 전투에서 김무력 등이 이끄는 신라군이 크게 이겨 백제 좌평 4명과 군사 2만 9,600명을 죽였다고 한다. 이후 백제와 신라는 돌이킬 수 없는 적대 관계가 되었다.', '『삼국사기』 신라본기 진흥왕 15년, 백제본기 성왕 32년; 『일본서기』 긴메이 천황기', ["Okcheon County Jungang-ro Okcheon Bridge 20240730.jpg", "옥천 시가지 (관산성이 있던 지역) (대체 사진)", "LandAndTree / CC0"]],
  ['전쟁', '대가야 멸망', '562년', '대가야 (고령)', false, 35.727, 128.26, '고령을 중심으로 한 대가야는 5~6세기 후기 가야 연맹을 이끌었으나, 관산성 전투에서 백제와 함께 패한 뒤 세력이 크게 약해졌다. 562년 진흥왕은 이사부에게 대가야를 치게 했고, 열다섯 살 남짓의 화랑 사다함이 기병 5천을 이끌고 먼저 성문으로 쳐들어가 성을 함락했다. 이로써 가야 연맹은 완전히 사라졌다. 고령 지산동 고분군 등 가야 고분군은 2023년 유네스코 세계유산에 등재되었다.', '『삼국사기』 신라본기 진흥왕 23년, 사다함 열전', ["2014-04-06 Goryeong Jisan-dong Tombs.jpg", "고령 지산동 고분군", "하늘도깨비 / CC BY 4.0"]],
  ['전쟁', '살수대첩', '612년', '살수 (청천강설)', true, 39.62, 125.66, '수 양제는 612년 113만여 명의 대군으로 고구려를 침공했다. 요동성 공격이 막히자 우중문·우문술이 이끄는 별동대 30만여 명이 평양성을 향해 곧장 내려왔다. 을지문덕은 거짓으로 패하며 적을 깊이 끌어들인 뒤 적장에게 시를 보내 철군을 유도했다. 수군이 살수를 건너 돌아갈 때 고구려군이 뒤를 쳐, 살아서 요동으로 돌아간 자가 2,700명에 불과했다고 한다.', '『삼국사기』 고구려본기 영양왕, 을지문덕 열전; 『수서』', ["초등대한역사 제2편 10.jpg", "을지문덕 (1908년 『초등대한역사』 삽화) (대체 사진)", "정인호 『초등대한역사』(1908) / 퍼블릭 도메인"]],
  ['기타', '연개소문의 정변', '642년', '평양', false, 39.02, 125.70, '당과의 전쟁에 대비해 천리장성 축조를 감독하던 연개소문은 대신들이 자신을 제거하려 하자 먼저 움직였다. 642년 그는 군대 사열을 핑계로 대신 100여 명을 불러 모아 죽이고, 궁궐로 들어가 영류왕까지 죽였다. 이어 영류왕의 조카 장(보장왕)을 왕으로 세우고 스스로 막리지가 되어 군사와 정치의 실권을 쥐었다. 이 정변은 당 태종이 고구려를 침공하는 구실이 되었다.', '『삼국사기』 고구려본기 영류왕·보장왕, 개소문 열전', ["Cheolli Jangseong.png", "고구려 천리장성 추정 경로 지도 (대체 사진)", "Historiographer (talk) (Uploads) / 퍼블릭 도메인"]],
  ['전쟁', '안시성 전투', '645년', '안시성 (요령성 해성 영성자산성설)', true, 40.85, 122.75, '연개소문의 정변을 구실로 당 태종이 직접 대군을 이끌고 고구려를 침공했다. 당군은 개모성·요동성·백암성을 차례로 함락하고 안시성을 포위했다. 당군은 성 옆에 거대한 토산을 쌓아 공격했으나 고구려군이 무너진 토산을 빼앗아 버텼다. 88일간의 공방 끝에 추위와 군량 부족으로 당 태종은 군대를 돌렸다. 성주의 이름은 정사에 전하지 않으며, 양만춘이라는 이름은 후대 기록에 처음 보인다.', '『삼국사기』 고구려본기 보장왕; 『구당서』·『신당서』 고려전; 『자치통감』', ["Tang Taizong (cropped).jpg", "당 태종 이세민 초상 (대체 사진)", "작자 미상 / 퍼블릭 도메인"]],
  ['반란', '비담의 난', '647년', '명활성 (경주)', false, 35.83, 129.27, '선덕여왕 말년인 647년 정월, 귀족 회의의 우두머리인 상대등 비담과 염종 등은 "여자 임금은 나라를 잘 다스릴 수 없다"며 명활성을 근거로 반란을 일으켰다. 김유신이 이끄는 왕의 군대는 월성에 진을 치고 열흘 넘게 맞섰다. 밤에 큰 별이 월성에 떨어져 민심이 흔들리자, 김유신은 불붙인 허수아비를 연에 매달아 올려 별이 다시 하늘로 올라갔다고 소문을 냈다고 한다. 반란 도중 선덕여왕이 세상을 떠나고 진덕여왕이 즉위했으며, 비담 등은 처형되었다.', '『삼국사기』 신라본기 선덕왕 16년·진덕왕 원년, 김유신 열전', ["Encykorea-경주 명활성 성벽.jpg", "경주 명활성 성벽", "한국학중앙연구원 / 공공누리 제1유형"]],
  ['전쟁', '황산벌 전투', '660년', '황산벌 (논산 연산면 일대)', true, 36.21, 127.10, '660년 당의 소정방이 이끈 13만 대군이 바다로, 김유신이 이끈 신라군 5만이 육로로 백제를 공격했다. 계백은 결사대 5천을 이끌고 황산벌에 진을 치고 신라군과 네 번 싸워 모두 이겼다. 그러나 화랑 반굴과 관창의 전사로 사기가 오른 신라군의 총공격에 결국 패했고, 계백도 전사했다. 이후 나당연합군은 사비성으로 향했다.', '『삼국사기』 신라본기 태종무열왕, 계백 열전, 관창 열전', ["황산벌 전투.jpg", "황산벌 전투 기록화 (대체 사진)", "전쟁기념관 / 공공누리 제1유형"]],
  ['전쟁', '사비성 함락 (백제 멸망)', '660년', '사비성 (부여)', false, 36.288, 126.907, '황산벌에서 계백의 결사대를 물리친 신라군과 백강을 거슬러 온 당군이 사비성에서 만났다. 의자왕은 태자와 함께 웅진성으로 피했으나, 사비성이 함락되자 7월 18일 항복했다. 이로써 678년간 이어진 백제가 멸망했다. 의자왕과 왕족·신하, 백성 1만 2천여 명이 당으로 끌려갔고, 당은 웅진도독부 등을 두어 백제 땅을 다스리려 했다.', '『삼국사기』 백제본기 의자왕, 신라본기 태종무열왕', ["Busosanseong 022.jpg", "부여 부소산성 백화정 (낙화암 위)", "travel oriented / CC BY-SA 2.0"]],
  ['전쟁', '백강 전투', '663년', '백강 (금강 하구설, 동진강설)', true, 36.04, 126.78, '백제 멸망 뒤 복신·도침과 왕자 부여풍은 주류성을 거점으로 부흥 운동을 벌였고, 왜는 대규모 지원군을 보냈다. 663년 8월 백강 어귀에서 왜 수군과 당 수군이 맞붙었는데, 당군이 네 번 싸워 모두 이기고 왜선 400척을 불태웠다고 한다. 곧이어 주류성도 함락되며 백제 부흥 운동은 사실상 끝났다.', '『구당서』 유인궤전; 『삼국사기』 백제본기; 『일본서기』 덴지 천황기', ["Encykorea-동진강 Dongjin River.jpg", "동진강 (백강 추정지 가운데 하나) (추정되는 위치)", "한국학중앙연구원 / 공공누리 제1유형"]],
  ['전쟁', '평양성 함락 (고구려 멸망)', '668년', '평양성', false, 39.04, 125.80, '연개소문이 죽은 뒤 맏아들 남생과 동생 남건·남산 사이에 권력 다툼이 벌어졌고, 남생은 당에 투항했다. 이 틈을 타 당의 이적과 신라군이 고구려를 협공했다. 668년 9월 평양성이 한 달 넘게 포위된 끝에 승려 신성이 성문을 열면서 함락되었고, 보장왕이 항복해 고구려가 멸망했다. 당은 평양에 안동도호부를 두었다.', '『삼국사기』 고구려본기 보장왕, 신라본기 문무왕', ["Taedong Gate, Pyongyang (5063216865).jpg", "평양 대동문 (고구려 평양성 자리에 조선 시대에 다시 세운 문)", "David Stanley from Nanaimo, Canada / CC BY 2.0"]],
  ['전쟁', '매소성 전투', '675년', '매소성 (연천 대전리산성설)', true, 38.05, 127.07, '나당전쟁 중 당은 이근행이 이끄는 20만 대군을 매소성에 주둔시켰다. 675년 신라군은 이를 공격해 크게 이겼고, 말 3만 380필과 그에 맞먹는 병기를 얻었다고 한다. 이 승리로 신라는 임진강과 한강 유역의 주도권을 쥐었다. 매소성은 연천 대전리산성으로 보는 견해가 유력하지만 양주 등 다른 학설도 있다.', '『삼국사기』 신라본기 문무왕 15년', ["매소성 전투.jpg", "매소성 전투 기록화 (대체 사진)", "전쟁기념관 / 공공누리 제1유형"]],
  ['전쟁', '기벌포 전투', '676년', '기벌포 (서천 장항 일대)', true, 36.01, 126.69, '676년 11월 설인귀가 이끈 당 수군이 금강 하구 기벌포로 들어오자 사찬 시득이 이끈 신라 수군이 맞섰다. 첫 싸움에서는 졌지만 이후 크고 작은 22차례 전투에서 이겨 적 4천여 명을 베었다. 이 승리로 당은 한반도에서 물러나 안동도호부를 요동으로 옮겼고, 신라는 대동강 이남 지역을 차지하며 삼국 통일을 이루었다.', '『삼국사기』 신라본기 문무왕 16년', ["Janghang port.jpg", "서천 장항항 (기벌포 추정지) (추정되는 위치)", "Jjw / CC BY-SA 4.0"]],

  // 남북국·후삼국
  ['반란', '김흠돌의 난', '681년', '서라벌 (경주)', false, 35.832, 129.218, '신문왕이 즉위한 681년, 왕비의 아버지인 소판 김흠돌이 파진찬 흥원, 대아찬 진공 등과 반란을 꾀하다 발각되어 처형되었다. 신문왕은 이 사건을 계기로 연루된 진골 귀족들을 대거 숙청하고, 김흠돌의 딸인 왕비도 궁에서 내보냈다. 이 사건은 통일 이후 신라의 왕권이 크게 강화되는 계기가 되었다.', '『삼국사기』 신라본기 신문왕 원년', ["신문왕릉 HS no. 181.jpg", "경주 신문왕릉 (대체 사진)", "Ronnie Dayo / CC BY-SA 4.0"]],
  ['기타', '발해 건국', '698년', '동모산 (지린성 둔화 성산자산성설)', true, 43.37, 128.15, '고구려 멸망 뒤 영주 지역에 옮겨져 살던 고구려 유민과 말갈인들은 696년 거란인 이진충의 반란으로 당의 통제가 흔들리자 동쪽으로 이동했다. 대조영은 추격해 온 당군을 천문령에서 크게 물리친 뒤 698년 동모산에 터를 잡고 나라를 세워 진국이라 했다. 713년 당이 대조영을 발해군왕으로 책봉하면서 발해라는 이름을 쓰게 되었다. 발해는 일본에 보낸 국서에서 고구려를 계승했다고 밝혔다.', '『구당서』 발해말갈전; 『신당서』 발해전; 『속일본기』', ["五号墓と奥に見える貞恵公主墓.jpg", "돈화 육정산 고분군 정혜공주묘 (동모산 인근) (대체 사진)", "Senkaku Islands / CC BY-SA 4.0"]],
  ['전쟁', '장문휴의 등주 공격', '732년', '등주 (산둥성 펑라이)', false, 37.81, 120.75, '발해 무왕은 흑수말갈 문제를 두고 당과 갈등을 빚었다. 732년 무왕은 장문휴에게 수군을 이끌고 바다를 건너 당의 등주를 치게 했고, 장문휴는 등주자사 위준을 죽였다. 당은 신라에 발해의 남쪽을 공격하라고 요청했으나, 733년 신라군은 큰 눈과 추위로 절반 가까이를 잃고 돌아왔다. 발해가 바다 건너 당 본토를 공격할 만큼 강성했음을 보여 주는 사건이다.', '『구당서』·『신당서』 발해전; 『삼국사기』 신라본기 성덕왕 32년', ["蓬莱水城-20160825.jpg", "펑라이 수성 (옛 등주 항구 자리)", "Antigng / CC BY-SA 4.0"]],
  ['반란', '김헌창의 난', '822년', '웅천주 (공주)', false, 36.46, 127.12, '김헌창의 아버지 김주원은 785년 선덕왕이 죽은 뒤 왕위에 오를 예정이었으나, 홍수로 알천을 건너지 못하는 사이 김경신(원성왕)이 즉위했다. 822년 웅천주 도독이던 김헌창은 이를 명분으로 반란을 일으켜 나라 이름을 장안, 연호를 경운이라 했다. 한때 무진주·완산주·청주(진주)·사벌주 등이 호응했으나 신라 중앙군에게 진압되었고, 김헌창은 스스로 목숨을 끊었다.', '『삼국사기』 신라본기 헌덕왕 14년', ["Korea-Gongju-Gongsanseong-01.jpg", "공주 공산성 (웅천주의 중심지)", "Michael / CC BY 2.0"]],
  ['기타', '장보고의 청해진 설치', '828년', '청해진 (완도 장도)', false, 34.346, 126.76, '당에서 무령군 소장으로 활동하던 장보고는 신라인들이 해적에게 붙잡혀 노비로 팔리는 것을 보고 돌아와, 828년 흥덕왕에게 청하여 군사 1만 명으로 완도에 청해진을 세웠다. 청해진은 해적을 몰아내고 신라·당·일본을 잇는 해상 무역의 중심이 되었다. 장보고는 이후 신무왕 즉위를 도왔으나 딸을 왕비로 들이는 문제로 중앙 귀족과 갈등을 빚다 암살되었고, 청해진은 851년 폐지되었다.', '『삼국사기』 신라본기 흥덕왕 3년, 장보고 열전; 엔닌 『입당구법순례행기』', ["Cheonghaejin jangdo.jpg", "완도 장도 청해진 유적", "완도군청 / CC BY-SA 2.0 kr"]],
  ['반란', '원종·애노의 난', '889년', '사벌주 (상주)', false, 36.41, 128.16, '진성여왕 때 신라는 왕실 기강이 흐트러지고 지방에서 세금이 걷히지 않아 나라 창고가 비었다. 889년 조정이 사신을 보내 세금을 독촉하자 각지에서 도적이 일어났는데, 사벌주에서 원종과 애노가 반란을 일으켰다. 진압을 맡은 나마 영기는 적의 기세에 눌려 나아가지 못했다. 이 봉기를 시작으로 각지에서 농민 봉기가 잇따랐고, 지방 호족이 성장하며 후삼국 시대가 열렸다.', '『삼국사기』 신라본기 진성왕 3년', ["상주보.jpg", "상주보와 낙동강 (상주 지역) (대체 사진)", "Dittwjfsdgkvkdjg / CC BY-SA 3.0"]],
  ['기타', '견훤의 후백제 건국', '900년', '완산주 (전주)', false, 35.82, 127.15, '상주 출신 군인 견훤은 서남 해안을 지키다 신라가 혼란해지자 892년 무진주(광주)를 점령하고 독자 세력을 이루었다. 900년 완산주로 도읍을 옮기고 의자왕의 원한을 갚겠다며 나라 이름을 백제라 하였는데, 역사에서는 이를 후백제라 부른다. 후백제는 중국 오월·후당과 외교 관계를 맺으며 후삼국 가운데 가장 강한 군사력을 갖추었다.', '『삼국사기』 견훤 열전', ["Encykorea-동고산성 (1).jpg", "전주 동고산성 (후백제 왕성 추정지) (추정되는 위치)", "한국학중앙연구원 / 공공누리 제1유형"]],
  ['기타', '궁예의 후고구려 건국', '901년', '송악 (개성)', false, 38.00, 126.56, '신라 왕족 출신이라 전하는 궁예는 승려로 지내다 북원의 양길 아래에서 세력을 키운 뒤 독립했다. 송악의 호족 왕륭·왕건 부자가 귀부하자 송악을 근거지로 삼고 901년 왕을 칭하며 고구려를 잇는다고 선언했다. 이후 국호를 마진(904), 태봉(911)으로 바꾸고 905년 철원으로 도읍을 옮겼다. 궁예는 말년에 스스로 미륵불이라 칭하며 폭정을 일삼다 918년 신하들에게 쫓겨났다.', '『삼국사기』 궁예 열전; 『고려사』 태조세가', ["Kaesong in 2018.jpg", "개성 시가와 송악산", "Christophe95 / CC BY-SA 4.0"]],
  ['전쟁', '발해 멸망', '926년', '상경 용천부 (헤이룽장성 닝안)', false, 43.97, 129.2, '거란을 통일한 야율아보기는 925년 말 발해 원정에 나섰다. 거란군은 926년 정월 요충지 부여성을 함락하고 곧바로 수도 홀한성(상경 용천부)을 포위했다. 발해의 마지막 왕 대인선은 성을 나와 항복했고, 거란은 발해 땅에 동란국을 세웠다. 발해 멸망 뒤 세자 대광현을 비롯한 많은 유민이 고려로 넘어왔다.', '『요사』 태조본기; 『고려사』 태조세가', ["亜細亜大観 16 007 \"東京城壁發掘の跡 （滿洲國）\".jpg", "1930년대 발해 상경성(동경성) 발굴 현장", "『亜細亜大観』 / 퍼블릭 도메인"]],
  ['전쟁', '견훤의 서라벌 습격 (포석정)', '927년', '포석정 (경주)', false, 35.80, 129.21, '927년 견훤은 신라의 왕경 서라벌을 기습했다. 『삼국사기』에 따르면 경애왕은 이때 포석정에서 왕비·궁녀들과 연회를 즐기다 습격을 받았고, 붙잡혀 스스로 목숨을 끊도록 강요당했다. 견훤은 김부를 왕(경순왕)으로 세우고 많은 사람과 보물을 빼앗아 돌아갔다. 한겨울에 연회를 벌였다는 기록 때문에 포석정이 제사 장소였다는 반론도 있다. 포석정 터에는 지금도 전복 모양으로 물길을 낸 돌 홈이 남아 있다.', '『삼국사기』 신라본기 경애왕, 견훤 열전', ['Korea-Gyeongju-Poseokjeong site 3832-06.JPG', '경주 포석정 터의 돌 물길', 'Steve46814 / CC BY-SA 3.0']],
  ['전쟁', '공산 전투', '927년', '공산 동수 (대구 팔공산 일대)', true, 35.98, 128.65, '신라를 구하러 나선 왕건은 직접 정예 기병 5천을 이끌고, 서라벌을 약탈하고 돌아가던 견훤의 군대를 공산 동수에서 맞았다. 그러나 후백제군에게 포위되어 크게 패했다. 신숭겸이 왕건의 갑옷을 입고 대신 싸우다 김락과 함께 전사한 덕분에 왕건은 겨우 몸을 피했다. 이 전투 이후 한동안 후백제가 후삼국의 주도권을 잡았다.', '『고려사』 태조세가, 신숭겸 열전; 『삼국사기』 견훤 열전', ["신숭겸장군유적 표충단 정면 (촬영년도 2015년).jpg", "대구 신숭겸 장군 유적 표충단", "문화재청 / 공공누리 제1유형"]],

  // 울릉도·제주도
  ['신화', '우해왕과 풍미녀 전설', null, '우산국 (울릉도)', true, 37.53, 130.84, '울릉도에 전해 오는 구전 설화에 따르면, 우산국의 우해왕은 기골이 장대하고 힘이 센 왕으로, 왜구가 자주 노략질하자 직접 대마도로 건너가 대마도주의 항복을 받았다. 이때 대마도주의 딸 풍미녀를 데려와 왕비로 삼았는데, 그 뒤 왕이 왕비의 사치를 채워 주려 백성을 괴롭히면서 나라가 기울었다고 한다. 문헌 기록이 없는 전설이므로 실제 연대와 장소를 알 수 없다.', '울릉군 구전 설화', ["KOCIS Port Taeha, Ulleungdo (4925397155).jpg", "울릉도 해안 (대체 사진)", "Korea.net / CC BY-SA 2.0"]],
  ['신화', '삼성혈 탐라 건국 신화', null, '삼성혈 (제주시)', true, 33.504, 126.529, '아득한 옛날 사람이 없던 탐라 땅, 한라산 북쪽 기슭의 모흥혈에서 고을나·양을나·부을나 세 신인이 솟아났다고 한다. 이들은 사냥을 하며 가죽옷을 입고 고기를 먹으며 살았다. 그 구멍이 지금 제주시의 삼성혈로 전해지며, 고·양·부 세 성씨의 시조 신화가 되었다. 조선 시대부터 이곳에서 세 신인에게 제사를 지내 왔고, 지금도 해마다 제례가 열린다.', '『고려사』 지리지 탐라현; 『영주지』', ["Three sacred holes in Jeju.JPG", "제주 삼성혈", "Ryuch / CC BY-SA 3.0"]],
  ['신화', '벽랑국 세 공주와의 혼인', null, '혼인지 (서귀포 성산읍 온평리)', true, 33.414, 126.901, '세 신인이 사냥하며 살던 어느 날, 동쪽 바닷가에 붉은 흙으로 봉한 나무 상자가 떠밀려 왔다. 상자 안에는 푸른 옷을 입은 세 처녀와 망아지·송아지, 오곡의 씨앗이 들어 있었는데, 이들은 동쪽 벽랑국(『고려사』에는 일본국)의 공주였다고 한다. 세 신인은 나이 순서대로 공주들과 혼인해 농사와 목축을 시작했다. 서귀포 성산읍 온평리의 연못 ‘혼인지’가 혼례를 올린 곳으로 전해진다.', '『고려사』 지리지 탐라현; 『영주지』', ["Jejuolle-route-03B 1.jpg", "온평 포구 (혼인지가 있는 마을) (대체 사진)", "Jeju Olle Foundation / CC BY-SA 4.0"]],
  ['기타', '우산국의 고려 조공', '930년', '우산국 (울릉도)', false, 37.47, 130.91, '울릉도의 우산국은 512년 이사부에게 정벌된 뒤 신라에 토산물을 바쳤다. 고려가 세워진 뒤인 930년 8월, 우릉도(우산국)는 백길과 토두를 보내 고려 태조에게 토산물을 바쳤다. 태조는 백길에게 정위, 토두에게 정조라는 벼슬을 내렸다. 울릉도가 고려와 공식 관계를 맺었음을 보여 주는 첫 기록이다.', '『고려사』 태조세가 13년', ["KOCIS Port Taeha, Ulleungdo (4925988370).jpg", "울릉도 앞바다 (대체 사진)", "Korea.net / CC BY-SA 2.0"]],
  ['전쟁', '동북 여진의 우산국 침략', '1018년', '우산국 (울릉도)', false, 37.52, 130.92, '1018년 우산국은 동북 여진의 해적에게 침략을 당해 농사를 짓지 못할 정도로 큰 피해를 입었다. 고려 현종은 이원구를 보내 농기구를 내려 주었다. 이듬해에는 여진에게 붙잡혀 갔다가 도망쳐 온 우산국 백성들을 모두 고향으로 돌려보냈다. 여진의 침략 이후 우산국은 세력을 회복하지 못하고 점차 고려의 지배 아래로 들어갔다.', '『고려사』 현종세가 9년·10년', ["KOCIS Mushroom Rock (4925987882).jpg", "울릉도 해안 바위 (대체 사진)", "Korea.net / CC BY-SA 2.0"]],
  ['기타', '삼별초의 제주 항전', '1273년', '항파두리성 (제주시 애월읍)', false, 33.453, 126.411, '진도에서 패한 뒤 김통정이 이끄는 삼별초는 제주에 항파두리성을 쌓고 저항을 이어 갔다. 이들은 전라도와 경상도 해안을 습격하며 조운선을 빼앗는 등 위세를 떨쳤다. 1273년 김방경과 흔도·홍다구가 이끄는 여몽연합군 1만여 명이 제주를 공격해 항파두리성이 함락되었고, 김통정은 한라산으로 들어가 자결했다. 이후 원은 제주에 탐라총관부를 두고 목마장을 운영했다.', '『고려사』 김방경 열전, 원종세가', ["Historic Site of Anti-Mongolian Struggle entrance.jpg", "제주 항파두리 항몽 유적", "Chipmunkdavis / CC BY-SA 4.0"]],

  // 고려
  ['기타', '고려 건국', '918년', '철원 (태봉 도성)', false, 38.33, 127.22, '궁예가 미륵불을 자처하며 의심과 폭정을 일삼자, 918년 6월 홍유·배현경·신숭겸·복지겸 네 장수가 시중 왕건을 찾아가 왕으로 추대했다. 궁예는 도망치다 부양(평강)에서 백성들에게 죽임을 당했다고 한다. 왕건은 철원의 포정전에서 즉위해 국호를 고려, 연호를 천수라 했으며, 이듬해 자신의 근거지인 송악으로 도읍을 옮겼다.', '『고려사』 태조세가 원년; 『삼국사기』 궁예 열전', ["Taejo of Goryeo.jpg", "고려 태조 왕건 청동상 (현릉 출토)", "한국문화유산정책연구소 / 저작자 표시"]],
  ['전쟁', '고창 전투', '930년', '고창 (안동)', false, 36.57, 128.73, '공산 전투 패배 이후 열세에 놓였던 왕건은 930년 정월 고창군 병산에서 견훤의 후백제군과 맞붙었다. 고창의 호족 김선평·권행·장정필 등이 고려 편에 서서 싸웠고, 고려군은 후백제군 8천여 명을 죽이는 큰 승리를 거두었다. 이 승리로 경상도 일대의 30여 군현이 잇따라 고려에 귀부하며 후삼국의 판도가 고려 쪽으로 기울었다.', '『고려사』 태조세가 13년', ["안동 태사묘 삼공신 유물 일괄 01.jpg", "안동 태사묘 삼공신 유물", "문화재청 / CC BY-SA 4.0"]],
  ['전쟁', '일리천 전투 (후백제 멸망)', '936년', '일리천 (구미 선산 일대)', true, 36.24, 128.30, '아버지 견훤을 금산사에 가두고 왕위에 오른 신검에 맞서, 935년 고려로 망명한 견훤은 왕건에게 후백제 토벌을 청했다. 936년 왕건은 견훤과 함께 8만 7천여 명의 대군을 이끌고 일리천에서 신검의 군대를 크게 이겼다. 고려군은 황산(논산)까지 추격했고 신검이 항복하면서 후백제가 멸망했다. 이로써 왕건은 935년 신라의 항복에 이어 후삼국 통일을 완성했다.', '『고려사』 태조세가 19년; 『삼국사기』 견훤 열전', ["개태사지 (1).jpg", "논산 개태사 터 (왕건이 후삼국 통일을 기념해 세운 절) (대체 사진)", "국가유산청 / 공공누리 제1유형"]],
  ['내전', '왕규의 난', '945년', '개경', false, 37.99, 126.53, '태조 왕건은 지방 호족과 혼인 관계를 맺어 29명의 왕비를 두었고, 그 결과 왕위 계승을 둘러싼 외척 간 갈등이 컸다. 혜종 때 광주 출신 호족 왕규는 자신의 외손자인 광주원군을 왕으로 세우려 혜종을 해치려 했다고 한다. 945년 혜종이 죽자 왕요는 서경의 왕식렴 군대를 끌어들여 왕규 일파를 제거하고 왕위(정종)에 올랐다. 왕규가 실제로 반역을 꾀했는지는 정종 측이 꾸민 것이라는 견해도 있다.', '『고려사』 왕규 열전, 정종세가', ["만월대.jpg", "개성 만월대 (고려 궁궐 터) (대체 사진)", "Eternal and life / CC BY-SA 4.0"]],
  ['전쟁', '거란 2차 침입과 개경 함락', '1011년', '개경', false, 37.94, 126.57, '1009년 강조가 목종을 폐하고 현종을 세우자, 거란 성종은 이를 구실로 1010년 11월 40만 대군을 이끌고 침입했다. 강조는 통주에서 패해 붙잡혀 죽었고, 거란군은 1011년 정월 개경을 함락하고 궁궐과 민가를 불태웠다. 현종은 나주까지 피란했다. 그러나 양규 등이 거란군의 퇴로를 끊고 포로를 구출하는 활약을 벌였고, 현종이 직접 거란에 가서 예를 갖추겠다는 조건으로 거란군이 물러갔다.', '『고려사』 현종세가, 양규 열전; 『고려사절요』', ["Sunjong in Manwoldae.jpg", "1909년 개성 만월대를 찾은 순종 일행 (개경 궁궐 터) (대체 사진)", "村上 / CC0"]],
  ['전쟁', '귀주대첩', '1019년', '귀주 (평북 구성)', true, 39.98, 125.24, '고려가 현종의 입조와 강동 6주 반환 요구를 거부하자, 거란은 1018년 12월 소배압에게 10만 대군을 주어 세 번째로 침입했다. 강감찬은 흥화진에서 쇠가죽으로 막아 둔 냇물을 터뜨려 적을 기습했고, 개경 근처까지 내려왔던 거란군은 고려의 청야 전술에 막혀 퇴각했다. 1019년 2월 강감찬은 귀주에서 퇴각하던 거란군을 크게 무찔러, 살아 돌아간 자가 수천 명에 불과했다고 한다. 이후 고려·송·거란 사이에 세력 균형이 이루어졌다.', '『고려사』 강감찬 열전, 현종세가', ["초등대한역사 제3편 2.jpg", "현종과 강감찬 (1908년 『초등대한역사』 삽화)", "정인호 『초등대한역사』(1908) / 퍼블릭 도메인"]],
  ['반란', '이자겸의 난', '1126년', '개경', false, 37.96, 126.58, '이자겸은 딸들을 예종과 인종의 왕비로 들이며 권력을 독점했다. 인종이 측근을 통해 그를 제거하려 하자, 1126년 이자겸은 척준경과 함께 군사를 일으켜 궁궐에 불을 지르고 인종을 자기 집에 가두었다. 그러나 인종은 이자겸과 척준경 사이를 갈라놓아 척준경으로 하여금 이자겸을 체포하게 했다. 이 난으로 개경 궁궐이 크게 불타고 문벌 귀족 사회의 모순이 드러났다.', '『고려사』 이자겸 열전, 척준경 열전, 인종세가', ["Kim Hong Do Kyehoe on Site of Manwoldae.jpg", "김홍도, 「만월대 계회도」 (개경 궁궐 터) (대체 사진)", "김홍도 / 퍼블릭 도메인"]],
  ['반란', '묘청의 난', '1135년', '서경 (평양)', false, 39.01, 125.73, '이자겸의 난으로 개경 궁궐이 불타고 민심이 흉흉해지자, 서경 출신 승려 묘청과 정지상 등은 개경의 지덕이 다했다며 서경 천도와 칭제건원, 금나라 정벌을 주장했다. 김부식 등 개경 세력의 반대로 천도가 좌절되자 1135년 묘청은 서경에서 국호를 대위, 연호를 천개라 하고 반란을 일으켰다. 김부식이 이끈 관군은 1년여 만인 1136년 서경을 함락했다. 신채호는 이 사건을 "조선 역사상 일천년래 제일대사건"이라 평가했다.', '『고려사』 묘청 열전, 김부식 열전; 신채호 『조선사연구초』', ["Samguk Sagi Donghae Page.jpeg", "김부식이 편찬한 『삼국사기』의 한 면 (대체 사진)", "Kim Pusik / 퍼블릭 도메인"]],
  ['기타', '무신정변', '1170년', '개경 보현원 일대', true, 37.97, 126.55, '고려 중기 문신 중심 정치 아래에서 무신들은 차별 대우를 받았다. 1170년 의종이 보현원으로 행차하던 중 무신들이 수박희를 하는 자리에서 대장군 이소응이 젊은 문신 한뢰에게 뺨을 맞는 일이 벌어졌다. 이를 계기로 정중부·이의방·이고 등이 문신들을 살해하고 의종을 거제로 내쫓은 뒤 명종을 세웠다. 이후 약 100년간 무신이 권력을 쥔 무신 정권 시대가 이어졌다.', '『고려사』 정중부 열전, 의종세가', ["거제 둔덕기성.jpg", "거제 둔덕기성 (쫓겨난 의종이 머문 곳으로 전해짐)", "국가유산청 / CC BY-SA 4.0"]],
  ['반란', '조위총의 난', '1174년', '서경 (평양)', false, 39.06, 125.76, '무신정변 후 정중부·이의방 등이 권력을 다투자, 1174년 서경유수 조위총은 의종을 죽인 자들을 벌한다는 명분으로 군사를 일으켰다. 서북면 40여 성이 호응할 만큼 세력이 컸으나 윤인첨 등이 이끈 관군에게 밀렸고, 1176년 서경이 함락되며 조위총은 처형되었다. 그 뒤로도 서북 지역에서는 잔여 세력의 저항이 이어졌다.', '『고려사』 조위총 열전, 명종세가', ["Moran Hill Pyongyang, DPRK (14224554835).jpg", "평양 모란봉 (서경) (대체 사진)", "Clay Gilliland / CC BY-SA 2.0"]],
  ['반란', '망이·망소이의 난', '1176년', '공주 명학소 (대전 탄방동 일대설)', true, 36.34, 127.39, '공주 명학소는 일반 군현보다 세금과 역이 무거운 특수 행정 구역이었다. 1176년 정월 이곳 주민 망이·망소이가 무리를 모아 봉기해 공주를 함락했다. 조정은 명학소를 충순현으로 승격시키며 달랬으나 곧 진압에 나섰고, 망이·망소이는 다시 일어나 충청도 일대를 휩쓸었다. 1177년 결국 진압되었고, 이 봉기는 무신 정권기 하층민 봉기의 시작으로 평가된다.', '『고려사』 명종세가; 『고려사절요』', ["Daejeon City Tanbang-dong Namsun Park 20260315 (03).jpg", "대전 탄방동 남선공원 일대 (명학소 추정지) (추정되는 위치)", "Treeinkr / CC BY-SA 4.0"]],
  ['반란', '김사미·효심의 난', '1193년', '운문 (청도 운문면)', true, 35.65, 128.95, '1193년 운문(청도)에서 김사미가, 초전(울산)에서 효심이 각각 봉기했다. 두 세력은 서로 연합해 경상도 일대를 휩쓸었고, 진압하러 간 대장군 전존걸은 패한 뒤 스스로 목숨을 끊었다. 당시 집권자 이의민이 신라 부흥을 꾀하며 이들과 내통했다는 의심도 받았다. 1194년 김사미가 항복해 처형되고 효심도 사로잡히면서 봉기는 진압되었다.', '『고려사』 명종세가, 이의민 열전', ["처진소나무.jpg", "청도 운문사 처진소나무 (운문 지역) (대체 사진)", "기여자 / CC0"]],
  ['내전', '최충헌·최충수 형제의 다툼', '1197년', '개경', false, 37.95, 126.54, '1196년 이의민을 제거하고 권력을 잡은 최충헌·최충수 형제는 이듬해 명종을 폐하고 신종을 세웠다. 그런데 최충수가 자기 딸을 태자비로 들이려고 기존 태자비를 내쫓으려 하자 최충헌이 이를 말렸고, 형제의 갈등은 결국 개경 시가지에서의 무력 충돌로 번졌다. 최충수는 패하여 도망치다 붙잡혀 죽었고, 최충헌은 60여 년에 걸친 최씨 무신 정권의 기틀을 다졌다.', '『고려사』 최충헌 열전', ["VIEW OF KAESONG CITY DPR KOREA OCT 2012 (8157429066).jpg", "개성 시가 (옛 개경) (대체 사진)", "calflier001 / CC BY-SA 2.0"]],
  ['반란', '만적의 난', '1198년', '개경', false, 37.98, 126.58, '최충헌의 사노비 만적은 1198년 개경 북산에서 나무를 하던 노비들을 모아 "왕후장상의 씨가 어찌 따로 있겠는가"라고 외치며 봉기를 계획했다. 흥국사에 모여 최충헌 등을 죽이고 노비 문서를 불태우기로 약속했으나, 약속한 날 모인 사람이 적어 날짜를 미루었다. 그 사이 한 노비가 주인에게 밀고해 만적 등 100여 명이 붙잡혀 강물에 던져졌다.', '『고려사』 최충헌 열전; 『고려사절요』 신종 원년', ["Namdaemun (Kaesong) around 1910s, Photo-No.5084.jpg", "개성 남대문 (1910년대) (대체 사진)", "도리이 류조 / 퍼블릭 도메인"]],
  ['사고', '마도 1호선 침몰', '1208년 (추정, 목간 기록)', '태안 마도 앞바다', false, 36.70, 126.13, '2009~2010년 충남 태안 마도 앞바다에서 발굴된 고려 시대 화물선이다. 함께 나온 목간(나무 꼬리표)에 1207년 말부터 1208년 초 사이의 날짜가 적혀 있어 침몰 시기를 알 수 있었다. 배에는 전라도 해남·나주·장흥 일대에서 개경의 관리들에게 보내는 벼·조·메밀 같은 곡물과 메주, 젓갈, 도자기 등이 실려 있었다. 마도 앞바다는 물살이 빠르고 암초가 많은 안흥량에 가까워 예부터 배가 자주 침몰한 곳이다.', '국립해양문화재연구소 『태안 마도 1호선 수중발굴조사 보고서』(2010)', ["Gauido at Taeanhaean National Park image 2.jpg", "태안 가의도 앞바다 (안흥량 인근 해역) (대체 사진)", "Jjw / CC BY-SA 4.0"]],
  ['기타', '강화 천도', '1232년', '강화도', false, 37.751, 126.488, '1231년 몽골의 1차 침입 뒤 간섭이 커지자, 집권자 최우는 1232년 6월 반대 의견을 누르고 수도를 강화도로 옮겼다. 강화도는 개경과 가깝고 물살이 거세며 갯벌이 넓어 기마병 위주인 몽골군이 건너기 어려웠다. 고려 조정은 이곳에서 39년간 항쟁했지만, 육지의 백성들은 몽골군의 약탈에 그대로 노출되었다. 1270년 원종이 개경으로 돌아가면서 강화 도읍 시대가 끝났다.', '『고려사』 고종세가, 최우 열전', ["Goryeogungji at Kanghwa.jpg", "강화 고려궁지", "Jjw / CC BY-SA 4.0"]],
  ['전쟁', '처인성 전투', '1232년', '처인성 (용인 남사면)', false, 37.13, 127.17, '강화 천도에 반발한 몽골은 1232년 살리타에게 2차 침입을 맡겼다. 살리타는 남쪽으로 내려와 용인의 작은 토성인 처인성을 공격했는데, 이곳에 피란해 있던 승려 김윤후와 처인부곡 주민들이 맞섰다. 전투 중 살리타가 화살에 맞아 죽자 몽골군은 철수했다. 김윤후는 공을 사양했고, 처인부곡은 이후 처인현으로 승격되었다.', '『고려사』 김윤후 열전, 고종세가', ["처인성.jpg", "용인 처인성", "국가유산청 / 공공누리 제1유형"]],
  ['전쟁', '황룡사 9층 목탑 소실', '1238년', '황룡사 (경주)', false, 35.836, 129.234, '황룡사는 신라 진흥왕 때 짓기 시작해 선덕여왕 때 높이 80m에 이르는 9층 목탑을 세운 신라 최대의 사찰이었다. 1238년 몽골의 3차 침입 때 몽골군이 경주까지 내려와 불을 질러, 9층 목탑과 장륙존상 등이 모두 불타 없어졌다. 지금은 넓은 절터에 목탑의 심초석과 금당 터의 주춧돌 등이 남아 있어 당시 규모를 짐작하게 한다.', '『고려사』 고종세가 25년; 『삼국유사』 탑상편 황룡사구층탑', ['Hwangnyongsa Temple Site 01.JPG', '경주 황룡사 터', 'Abasaa / 퍼블릭 도메인']],
  ['기타', '팔만대장경 완성', '1251년', '강화 대장경판당 (위치 미상)', true, 37.73, 126.45, '1232년 몽골의 침입으로 대구 부인사에 있던 초조대장경이 불타자, 고려 조정은 부처의 힘으로 외적을 물리치려는 염원을 담아 1236년 대장도감을 설치하고 대장경 판각을 다시 시작했다. 16년에 걸친 작업 끝에 1251년 완성된 경판은 8만 1천여 장에 이르며, 오탈자가 거의 없을 만큼 정교하다. 경판은 처음 강화도의 판당에 보관되었다가 조선 초 합천 해인사로 옮겨졌고, 2007년 유네스코 세계기록유산에 등재되었다.', '『고려사』 고종세가 38년; 이규보 「대장각판군신기고문」(『동국이상국집』)', ['Tripitaka Koreana.jpg', '해인사에 보관된 팔만대장경 경판', 'Arian Zwegers (2차 저작: MrPanyGoff) / CC BY 2.0']],
  ['전쟁', '충주성 전투', '1253년', '충주성 (충주)', true, 36.99, 127.93, '1253년 몽골 5차 침입 때 예쿠가 이끄는 몽골군이 충주성을 포위했다. 처인성 전투의 영웅 김윤후는 이때 방호별감으로 성을 지켰다. 70여 일간 포위가 이어져 식량이 바닥나자, 김윤후는 관노비 문서를 불태우고 공을 세우면 신분에 관계없이 벼슬을 주겠다고 약속해 사기를 북돋웠다. 결국 몽골군은 물러갔고 충주는 국원경으로 승격되었다.', '『고려사』 김윤후 열전', ["Chungju Namsanseong.jpg", "충주 남산성 (김윤후가 지킨 충주성 추정지) (추정되는 위치)", "Elsword2007 / CC0"]],
  ['기타', '삼별초의 진도 항쟁', '1270년', '용장성 (진도)', false, 34.53, 126.27, '1270년 원종이 몽골과 강화하고 개경 환도를 결정하자, 무신 정권의 군사 기반이던 삼별초는 이에 반발했다. 배중손 등은 왕족 승화후 온을 왕으로 세우고 배 1천여 척에 사람과 재물을 싣고 진도로 내려가 용장성을 거점으로 항쟁했다. 삼별초는 남해안 일대를 장악하고 일본에 국서를 보내기도 했으나, 1271년 김방경과 흔도가 이끈 여몽연합군에 진도가 함락되었다. 살아남은 무리는 김통정을 따라 제주로 옮겨 갔다.', '『고려사』 배중손 열전, 원종세가', ["진도 용장성.jpg", "진도 용장성", "한국학중앙연구원 / 공공누리 제1유형"]],
  ['전쟁', '여몽연합군의 1차 일본 원정', '1274년', '합포 (창원 마산, 출항지)', false, 35.20, 128.57, '원 세조 쿠빌라이는 일본이 복속 요구를 거부하자 일본 정벌을 결정하고, 고려에 배를 만들고 군사를 내라고 요구했다. 1274년 10월 몽골·한족 군사와 김방경이 이끄는 고려군 등 약 3만 명이 900여 척의 배를 타고 합포를 떠나 쓰시마·이키를 거쳐 하카타에 상륙했다. 일본군과 치열하게 싸웠으나 철수 과정에서 폭풍을 만나 큰 피해를 입었다. 고려는 전쟁 준비로 막대한 부담을 졌고, 1281년 2차 원정도 태풍으로 실패했다.', '『고려사』 김방경 열전, 원종세가; 『원사』 일본전', ["Mōko Shūrai Ekotoba.jpg", "『몽고습래회사』 (13세기 말, 일본)", "작자 미상 / 퍼블릭 도메인"]],
  ['사고', '신안선 침몰', '1323년 (추정, 목간 기록)', '신안 증도 앞바다', false, 35.04, 126.10, '1975년 전남 신안 증도 앞바다에서 어부의 그물에 청자가 걸려 올라오면서 발견된 원나라 무역선이다. 1976년부터 1984년까지 발굴해 도자기 2만여 점과 동전 28톤 등을 인양했다. 배에서 나온 목간에 ‘지치 3년’(1323)이라는 원나라 연호와 일본 교토 도후쿠지 등 화물 주인이 적혀 있어, 경원(지금의 닝보)을 떠나 일본 하카타로 가던 중 침몰한 것으로 보인다. 14세기 동아시아 해상 교역을 보여 주는 귀중한 자료이다.', '문화재청 신안해저유물 발굴조사보고서; 국립해양문화재연구소 소장 자료', ["Sinan Shipwreck Exhibition 02.jpg", "신안선 출수 유물 특별전 (2016년)", "Korea.net / CC BY-SA 2.0"]],
  ['전쟁', '쌍성총관부 수복', '1356년', '쌍성 (화주, 함남 금야)', false, 39.55, 127.25, '원은 1258년 고려 동북면의 화주에 쌍성총관부를 두고 철령 이북 땅을 직접 다스렸다. 원이 쇠퇴하자 공민왕은 1356년 기철 등 친원 세력을 숙청하는 한편, 유인우 등을 보내 쌍성총관부를 공격했다. 이때 이 지역 유력자였던 이자춘(이성계의 아버지)이 고려 편에 서서 공을 세웠고, 고려는 99년 만에 이 땅을 되찾았다. 이 일을 계기로 이자춘·이성계 부자가 중앙 정계에 진출했다.', '『고려사』 공민왕세가; 『태조실록』 총서', ["서울 마포 고려 공민왕 내외 영정.jpg", "공민왕과 노국대장공주 영정 (대체 사진)", "작자 미상 / 퍼블릭 도메인"]],
  ['전쟁', '홍건적의 개경 함락', '1361년', '개경', false, 37.97, 126.51, '원나라 말 한족 반란군인 홍건적은 원군에 쫓겨 고려로 밀려들었다. 1359년 1차 침입에 이어 1361년 10여만 명이 다시 쳐들어와 개경을 함락했고, 공민왕은 복주(안동)까지 피란했다. 이듬해 정세운·안우·이방실·김득배 등이 20만 군사로 개경을 되찾았다. 그러나 전쟁 뒤 김용의 모략으로 정세운이 살해되고 이어 안우·이방실·김득배도 죽임을 당하는 혼란이 일었다.', '『고려사』 공민왕세가, 정세운 열전', ["화장사 봉안 공민왕 어진 유리건판 촬영.jpg", "공민왕 어진 유리건판 사진 (대체 사진)", "작자 미상 / 퍼블릭 도메인"]],
  ['전쟁', '진포 대첩', '1380년', '진포 (금강 하구)', true, 35.99, 126.74, '고려 말 왜구는 해안뿐 아니라 내륙 깊숙이까지 약탈했다. 1380년 8월 왜구가 500여 척의 배를 이끌고 금강 하구 진포에 들어와 배들을 밧줄로 묶어 두고 내륙을 노략질했다. 나세·심덕부·최무선이 이끈 고려 수군은 최무선이 개발한 화포로 이 배들을 모두 불태웠다. 배를 잃은 왜구는 내륙으로 흩어졌고, 이들이 남원 운봉 쪽으로 몰려가 황산 대첩으로 이어졌다.', '『고려사』 최무선 열전; 『고려사절요』', ["Geum river seawall.jpg", "금강 하구 둑길 (진포 일대) (대체 사진)", "Ryuch / 퍼블릭 도메인"]],
  ['전쟁', '황산 대첩', '1380년', '황산 (남원 운봉)', false, 35.45, 127.53, '진포에서 배를 잃은 왜구는 경상도·전라도 내륙을 휩쓸며 남원 운봉 쪽으로 몰려들었다. 이성계는 1380년 9월 황산에서 이들을 맞아 싸웠다. 이성계와 이지란은 적장인 소년 장수 아지발도의 투구를 활로 쏘아 떨어뜨린 뒤 쏘아 죽였고, 고려군은 크게 이겼다. 이 승리로 이성계는 백성들 사이에서 큰 명성을 얻었다. 운봉에는 선조 때 세운 황산대첩비가 있었으나 일제강점기 말에 파괴되었다.', '『고려사』 우왕 열전; 『태조실록』 총서', ["황산대첩비.jpg", "남원 황산대첩비지 비각", "국가유산청 / 공공누리 제1유형"]],
  ['기타', '위화도 회군', '1388년', '위화도 (압록강 하중도)', false, 40.05, 124.42, '명이 철령 이북의 땅을 요구하자 우왕과 최영은 1388년 요동 정벌을 결정했다. 이성계는 작은 나라가 큰 나라를 거스르는 것, 여름에 군사를 일으키는 것, 왜구가 빈틈을 노릴 것, 장마철이라 활이 풀리고 전염병이 돌 것이라는 4불가론을 들어 반대했다. 압록강 하중도인 위화도에 이른 이성계와 조민수는 장마로 강물이 불어나자 군대를 돌려 개경으로 진격했고, 최영을 몰아내고 우왕을 폐했다. 이 사건으로 이성계가 실권을 잡았다.', '『고려사』 우왕 열전; 『태조실록』 총서', ["North Korea Sinuiju from Yalu River1.jpg", "압록강 하류 (위화도 인근)", "Suikotei / CC BY-SA 4.0"]],
  ['기타', '정몽주 피살', '1392년', '선죽교 (개성)', false, 37.982, 126.565, '정몽주는 이성계와 함께 개혁을 추진했으나 고려 왕조를 무너뜨리는 것에는 반대했다. 1392년 이성계가 사냥 중 말에서 떨어져 다치자 정몽주는 이 틈에 이성계 일파를 탄핵했다. 이방원이 「하여가」로 회유하자 정몽주는 「단심가」로 충절을 밝혔다고 전한다. 이방원은 결국 조영규 등을 보내 선죽교에서 그를 살해했고, 석 달 뒤 조선이 건국되었다. 선죽교는 지금 북한 개성에 남아 있다.', '『고려사』 정몽주 열전; 『태조실록』 총서', ['Sonjuk bridge in Kaesong, North Korea.jpg', '개성 선죽교', 'David Clayton Ellsworth / CC BY-SA 4.0']],

  // 조선
  ['기타', '조선 건국', '1392년', '개경 수창궁', true, 37.965, 126.565, '위화도 회군 이후 실권을 잡은 이성계와 신진 사대부는 과전법을 실시해 경제 기반을 마련하고 반대 세력을 제거했다. 1392년 7월 17일 이성계는 공양왕을 폐하고 개경 수창궁에서 왕위에 올랐다. 이듬해 명의 승인을 받아 나라 이름을 조선으로 정했는데, 단군 조선을 잇는다는 뜻을 담고 있다. 이로써 474년간 이어진 고려 왕조가 막을 내렸다.', '『태조실록』 1년; 『고려사』 공양왕 열전', ["King Taejo Yi 02.jpg", "태조 어진 (1872년 이모본, 전주 경기전)", "조중묵·박기준 외 / 퍼블릭 도메인"]],
  ['기타', '한양 천도', '1394년', '한양 (경복궁)', false, 37.582, 126.975, '태조는 고려의 기반인 개경을 떠나 새 도읍을 세우고자 했다. 계룡산 일대에 도읍 공사를 시작했다가 중단한 뒤, 여러 논의를 거쳐 한강을 끼고 산으로 둘러싸인 한양을 새 도읍으로 정했다. 1394년 10월 천도하고 이듬해 종묘와 경복궁을 완공했다. 정도전은 궁궐과 전각의 이름을 지었는데, 경복궁은 『시경』의 구절에서 따온 이름이다. 경복궁은 임진왜란 때 불타 1867년 중건되었다.', '『태조실록』 3년·4년; 정도전 『삼봉집』', ['Geunjeongjeon Seoul.jpg', '경복궁 근정전 (1867년 중건)', 'Kallerna / CC BY-SA 4.0']],
  ['내전', '제1차 왕자의 난', '1398년', '한양', false, 37.578, 126.977, '태조는 신덕왕후 강씨가 낳은 막내아들 이방석을 세자로 삼았고, 정도전은 재상 중심 정치와 사병 혁파를 추진했다. 이에 불만을 품은 신의왕후 한씨 소생의 왕자들, 특히 조선 건국에 공이 컸던 이방원은 1398년 8월 군사를 일으켜 정도전·남은 등을 죽이고 세자 방석과 그 형 방번을 제거했다. 충격을 받은 태조는 왕위를 둘째 아들 방과(정종)에게 물려주었다.', '『태조실록』 7년; 『정종실록』', ["정도전사당.jpg", "정도전 사당 (평택) (대체 사진)", "국가유산청 / 공공누리 제1유형"]],
  ['내전', '제2차 왕자의 난', '1400년', '개경', false, 37.955, 126.525, '정종이 아들 없이 즉위하자 다음 왕위를 두고 태조의 넷째 아들 이방간과 다섯째 아들 이방원이 맞서게 되었다. 당시 도읍은 잠시 개경으로 돌아가 있었다. 1400년 정월 박포의 부추김을 받은 이방간이 군사를 일으켜 개경 시내에서 이방원의 군사와 싸웠으나 패했다. 이방간은 유배되고 박포는 처형되었으며, 이방원은 곧 세제로 책봉되어 그해 11월 왕위(태종)에 올랐다.', '『정종실록』 2년', ["Heolleung Royal Tomb (헌능) with annex.jpg", "서울 헌릉 (태종 무덤) (대체 사진)", "Noh Mun Duek / CC BY-SA 4.0"]],
  ['전쟁', '대마도 정벌', '1419년', '쓰시마 (아소만 일대)', true, 34.30, 129.28, '조선 초에도 왜구의 약탈이 이어지자, 1419년 5월 왜구가 충청도 비인과 황해도 해주를 습격한 것을 계기로 상왕 태종은 왜구의 근거지인 쓰시마 정벌을 결정했다. 6월 이종무가 이끄는 병선 227척, 군사 1만 7천여 명이 거제를 떠나 쓰시마에 상륙해 왜구의 배와 집을 불태웠다. 이후 쓰시마 도주의 요청으로 조선은 삼포를 열어 제한된 교역을 허락했다.', '『세종실록』 1년', ["Aso Bay viewed from Mount Jo-2.jpg", "쓰시마 아소만", "Saigen Jiro / CC0"]],
  ['기타', '계유정난', '1453년', '한양', false, 37.565, 126.965, '문종이 일찍 세상을 떠나 12살의 단종이 즉위하자, 정치 실권은 김종서·황보인 등 고명대신에게 있었다. 1453년 10월 단종의 숙부 수양대군은 한명회·권람 등과 함께 김종서의 집을 찾아가 그를 철퇴로 쓰러뜨리고, 왕명이라 속여 대신들을 궁으로 불러들여 살해했다. 수양대군은 영의정이 되어 권력을 장악했고, 1455년 단종에게서 왕위를 물려받아 세조로 즉위했다.', '『단종실록』 1년', ["CheongRyeongpo Eoso.JPG", "영월 청령포 어소 (단종 유배지) (대체 사진)", "Naturehead / CC BY-SA 3.0"]],
  ['반란', '이시애의 난', '1467년', '길주', false, 40.96, 129.33, '세조는 중앙 집권을 강화하며 함길도에 중앙 관리를 수령으로 보내고 토착 세력을 견제했다. 이에 반발한 길주의 토호 이시애는 1467년 5월 함길도 절도사 강효문이 반역을 꾀했다고 거짓 소문을 퍼뜨린 뒤 그를 죽이고 반란을 일으켰다. 함길도 전역이 호응할 만큼 기세가 컸으나, 구성군 이준과 남이·어유소 등이 이끄는 관군에게 석 달 만에 진압되었다. 이 일을 계기로 지방 유향소가 폐지되었다.', '『세조실록』 13년', ["세조 어진 초본.jpg", "세조 어진 초본 (대체 사진)", "김은호 / 퍼블릭 도메인"]],
  ['기타', '정여립 모반 사건', '1589년', '죽도 (진안)', true, 35.83, 127.47, '전주 출신 정여립은 서인에서 동인으로 옮긴 뒤 낙향해 진안 죽도에서 대동계를 조직했다. 1589년 10월 황해도 관찰사 등이 정여립이 모반을 꾀한다고 고변하자, 정여립은 죽도로 피했다가 관군에 포위되자 스스로 목숨을 끊었다. 이후 서인 정철이 사건 조사를 맡으면서 3년에 걸친 기축옥사로 이어졌고, 동인 1천여 명이 죽거나 처벌받았다. 실제 모반이 있었는지, 꾸며진 사건인지는 지금도 논란이 있다.', '『선조실록』 22년; 『선조수정실록』', ["Maisan.jpg", "진안 마이산 (정여립이 활동한 진안 지역) (대체 사진)", "Joachim Dirauf / CC BY 3.0"]],
  ['전쟁', '부산진 전투', '1592년', '부산진성 (부산 동구)', false, 35.137, 129.058, '1592년 4월 13일, 고니시 유키나가가 이끄는 일본군 제1군이 부산 앞바다에 이르렀다. 이튿날 새벽 일본군은 부산진성을 공격했고, 첨사 정발이 이끄는 군민은 끝까지 싸웠으나 성이 함락되고 정발은 전사했다. 다음 날 동래성도 함락되어 부사 송상현이 순절했다. 이후 일본군은 20일 만에 한양에 들어왔다. 7년에 걸친 임진왜란의 첫 전투였다.', '『선조수정실록』 25년; 류성룡 『징비록』', ["Busanjinsunjeoldo.jpg", "「부산진순절도」 (1760년, 변박)", "변박 / 퍼블릭 도메인"]],
  ['전쟁', '한산도 대첩', '1592년', '한산도 앞바다 (통영)', false, 34.78, 128.48, '임진왜란 초기 육지에서 연패하던 조선은 바다에서 반격했다. 1592년 7월 이순신은 견내량에 머물던 와키자카 야스하루의 일본 수군을 넓은 한산도 앞바다로 유인한 뒤, 학이 날개를 펼친 모양의 학익진으로 포위해 공격했다. 조선 수군은 일본 배 59척을 격침하거나 빼앗는 큰 승리를 거두었다. 이 해전으로 일본은 남해를 거쳐 서해로 보급하려던 계획이 막혔다.', '『선조실록』; 이순신 「견내량파왜병장」(『이충무공전서』)', ["Korea-Tongyeong-Hansan Island-Jeseungdang-01.jpg", "통영 한산도 제승당", "Asfreeas at Korean Wikipedia / CC BY-SA 3.0"]],
  ['전쟁', '진주대첩', '1592년', '진주성', false, 35.19, 128.08, '1592년 10월 일본군 약 2만 명이 경상우도의 요충지 진주성을 공격했다. 진주목사 김시민은 3,800여 명의 군사로 화포와 화약, 돌과 끓는 물까지 동원해 6일간 성을 지켜냈고, 곽재우 등 의병이 바깥에서 일본군을 견제했다. 김시민은 전투 막바지에 총탄을 맞아 순국했다. 이듬해 6월 일본군은 대군으로 다시 진주성을 공격해 함락했고, 이때 논개가 왜장을 껴안고 남강에 몸을 던졌다고 전한다.', '『선조수정실록』 25년; 류성룡 『징비록』', ['Choksuk Pavillion-JinjuCastle.jpg', '진주성 촉석루 (한국전쟁 때 불타 1960년 재건)', 'Kang Byeong Kee / CC BY 3.0']],
  ['전쟁', '행주대첩', '1593년', '행주산성 (고양)', false, 37.598, 126.825, '1593년 1월 평양성을 되찾은 조·명 연합군이 벽제관에서 패해 주춤하자, 일본군은 한양 근처로 병력을 모았다. 전라도 순찰사 권율은 2,300여 명의 군사로 한강 가 행주산성에 진을 쳤고, 2월 12일 일본군 3만여 명이 일곱 부대로 나뉘어 하루 종일 공격했다. 조선군은 화차와 비격진천뢰, 돌 등으로 맞서 이를 모두 물리쳤다. 부녀자들이 치마로 돌을 날랐다는 ‘행주치마’ 이야기는 민간 설화로, 이 말은 전투 이전 문헌에도 이미 보인다.', '『선조실록』 26년; 류성룡 『징비록』', ['Haengjudaecheopbi.jpg', '행주산성의 행주대첩비', 'IRTC1015 / 퍼블릭 도메인']],
  ['전쟁', '명량 해전', '1597년', '울돌목 (해남·진도 사이)', false, 34.57, 126.31, '칠천량 해전에서 원균의 조선 수군이 거의 전멸한 뒤, 다시 삼도수군통제사가 된 이순신에게 남은 배는 12척(이후 1척 추가)에 불과했다. 1597년 9월 16일 이순신은 물살이 빠르고 폭이 좁은 울돌목(명량)에서 130여 척의 일본 수군을 맞아 싸웠다. 조선 수군은 거센 물살을 이용해 일본 배 31척을 격파하고 적을 물리쳤다. 이 승리로 일본 수군의 서해 진출이 막혔다.', '이순신 『난중일기』; 『선조실록』 30년', ["울돌목.jpg", "해남 울돌목", "Jangg8962 / CC BY-SA 4.0"]],
  ['전쟁', '노량 해전', '1598년', '노량 해협 (남해·하동 사이)', false, 34.94, 127.87, '1598년 8월 도요토미 히데요시가 죽자 일본군은 철수를 시작했다. 순천 왜교성에 갇힌 고니시 유키나가를 구하려 시마즈 요시히로 등이 이끄는 일본 수군 500여 척이 노량 해협으로 몰려왔다. 11월 19일 새벽 이순신은 명의 진린과 함께 이들을 맞아 크게 격파했으나, 전투 중 총탄에 맞아 "싸움이 급하니 나의 죽음을 알리지 말라"는 말을 남기고 전사했다. 이 해전을 끝으로 7년간의 전쟁이 끝났다.', '『선조실록』 31년; 류성룡 『징비록』; 『이충무공전서』', ["Noryang Bridge.jpg", "노량 해협 (노량대교)", "Glabb / 퍼블릭 도메인"]],
  ['반란', '이괄의 난', '1624년', '영변 (봉기지)', false, 39.81, 125.80, '이괄은 1623년 인조반정에 참여해 큰 공을 세웠으나 2등 공신에 그쳤고, 평안병사 겸 부원수로 영변에 나가 있었다. 1624년 정월 조정이 그의 아들을 역모 혐의로 압송하려 하자 이괄은 군사를 일으켜 한양으로 진격했다. 인조는 공주로 피란했고, 이괄은 한양을 점령해 흥안군을 왕으로 세웠다. 그러나 곧 안현(길마재) 전투에서 관군에게 패했고, 도망치던 중 부하들에게 살해되었다. 일부 잔당이 후금으로 달아나 정묘호란의 빌미가 되었다.', '『인조실록』 2년', ["Pavilion in Gongsanseong Fortress.jpg", "공주 공산성 (이괄의 난 때 인조가 피란한 곳) (대체 사진)", "Bernard Gagnon / CC0"]],
  ['전쟁', '병자호란 남한산성 항전', '1636년', '남한산성', false, 37.478, 127.182, '인조반정 이후 조선이 친명배금 정책을 펴자, 국호를 청으로 바꾼 홍타이지는 1636년 12월 직접 대군을 이끌고 침입했다. 청군이 빠르게 내려와 강화도로 가는 길이 막히자 인조는 남한산성으로 들어갔다. 성 안에서는 김상헌 등 끝까지 싸우자는 주전파와 최명길 등 화친을 맺자는 주화파가 맞섰다. 혹독한 추위와 식량 부족 속에 47일간 버텼으나, 강화도마저 함락되었다는 소식에 인조는 항복을 결정했다.', '『인조실록』 14년·15년; 나만갑 『병자록』; 『산성일기』', ['Namhansanseong.JPG', '남한산성 수어장대', 'Arne Hückelheim / CC BY-SA 3.0']],
  ['기타', '삼전도 항복', '1637년', '삼전도 (서울 송파)', true, 37.5085, 127.1033, '1637년 1월 30일 인조는 남한산성을 나와 한강 가 삼전도에서 청 태종에게 세 번 절하고 아홉 번 머리를 조아리는 예를 올리며 항복했다. 조선은 청과 군신 관계를 맺고 소현세자와 봉림대군 등을 볼모로 보냈으며, 수많은 백성이 포로로 끌려갔다. 청의 요구로 1639년 삼전도에 청 태종의 공덕을 기리는 비(대청황제공덕비)가 세워졌는데, 이 비는 지금 서울 송파구 석촌호수 근처에 남아 있다. 삼전나루의 정확한 위치는 추정이다.', '『인조실록』 15년', ['Samjeondo Monument.jpg', '삼전도비 (대청황제공덕비)', 'Kang Byeong Kee / CC BY 3.0']],
  ['반란', '이인좌의 난', '1728년', '청주성', false, 36.64, 127.49, '경종이 세상을 떠나고 영조가 즉위하자, 정권에서 밀려난 소론 강경파와 일부 남인은 영조가 경종을 독살했다는 의혹을 퍼뜨리며 반란을 꾀했다. 1728년 3월 이인좌는 청주성을 습격해 점령하고 밀풍군 탄을 왕으로 추대했다. 반란은 경상도·전라도로 번졌으나 병조판서 오명항이 이끄는 관군에게 안성·죽산에서 패하며 진압되었다. 이 사건 이후 영조는 탕평책을 더욱 강하게 추진했다.', '『영조실록』 4년', ["Cheongju Sangdangsangseong.jpg", "청주 상당산성 (대체 사진)", "Hutch1225 / 퍼블릭 도메인"]],
  ['기타', '수원 화성 완공', '1796년', '수원 화성', false, 37.287, 127.012, '정조는 아버지 사도세자의 묘를 수원 화산으로 옮기고, 원래 그 자리에 있던 수원 고을을 팔달산 아래로 옮겨 새 도시를 세웠다. 1794년 1월 성곽 공사를 시작해 1796년 9월 완공했다. 정약용이 설계에 참여하고 거중기와 녹로 같은 기구를 사용했으며, 일꾼들에게 품삯을 주었다. 공사의 전 과정이 『화성성역의궤』에 자세히 기록되어 있어, 한국전쟁 때 파손된 부분을 원형에 가깝게 복원할 수 있었다. 1997년 유네스코 세계유산에 등재되었다.', '『화성성역의궤』; 『정조실록』', ['Hwaseong Fortress 01.jpg', '수원 화성', 'Bernard Gagnon / CC0']],
  ['반란', '홍경래의 난', '1811년', '정주성', false, 39.69, 125.33, '세도 정치 아래 평안도는 서북 지역이라는 이유로 관직 진출에서 차별받았고, 관리의 수탈도 심했다. 몰락 양반 홍경래는 우군칙·김창시 등과 오랫동안 준비한 끝에 1811년 12월 가산 다복동에서 봉기했다. 봉기군은 열흘 남짓 만에 청천강 이북의 여러 군현을 장악했으나 송림 전투에서 패한 뒤 정주성으로 들어가 버텼다. 관군은 1812년 4월 성 밑에 굴을 파고 화약을 터뜨려 성을 함락했고, 홍경래는 전사했다.', '『순조실록』 11년·12년', ["Government Soldiers during Hong Gyeong-Rae's Rebellion.jpg", "홍경래의 난 때 정주성을 포위한 관군을 그린 그림 (규장각 소장)", "작자 미상 (규장각 소장) / 퍼블릭 도메인"]],
  ['반란', '진주 농민 봉기', '1862년', '진주', false, 35.18, 128.10, '1862년 2월 경상우병사 백낙신이 부정하게 거둬들인 세금을 백성에게 떠넘기자, 몰락 양반 유계춘의 주도로 진주 농민들이 봉기했다. 농민들은 진주성으로 몰려가 아전들을 죽이고 관청을 공격했다. 이 봉기를 시작으로 그해 삼남 지방을 중심으로 70여 곳에서 농민 봉기가 일어났다(임술 농민 봉기). 조정은 박규수를 안핵사로 보내 수습하고 삼정이정청을 설치해 삼정의 문란을 바로잡으려 했다.', '『철종실록』 13년; 『임술록』', ["Jinjuseong Fortress 02 - Gongbukmun Gate.jpg", "진주성 공북문", "Bernard Gagnon / CC0"]],
  ['전쟁', '병인양요', '1866년', '정족산성 (강화)', false, 37.625, 126.49, '1866년 초 흥선대원군이 천주교를 탄압해 프랑스 신부 9명과 수많은 신자가 처형되었다(병인박해). 이를 구실로 그해 9월 로즈 제독이 이끄는 프랑스 함대가 강화도를 점령했다. 한성근 부대가 문수산성에서, 양헌수 부대가 정족산성에서 프랑스군을 물리치자 프랑스군은 한 달여 만에 물러갔다. 이때 프랑스군은 외규장각에 보관된 의궤 등 도서를 약탈해 갔는데, 이 의궤는 2011년 임대 형식으로 한국에 돌아왔다.', '『고종실록』 3년', ["Jonghae-ru, the gate of Jeongjogsanseong at Ganghwa-do.jpg", "강화 정족산성 종해루", "Jjw / CC BY-SA 4.0"]],
  ['전쟁', '신미양요', '1871년', '광성보 (강화)', false, 37.675, 126.527, '1866년 평양 대동강에서 미국 상선 제너럴셔먼호가 불탄 사건을 구실로, 1871년 미국 아시아 함대의 로저스 제독이 군함 5척과 1,200여 명을 이끌고 강화도에 왔다. 미군은 초지진과 덕진진을 점령한 뒤 광성보를 공격했고, 어재연이 이끄는 조선군은 끝까지 싸우다 대부분 전사했다. 미군은 조선이 통상 협상에 응하지 않자 물러갔고, 흥선대원군은 전국에 척화비를 세워 통상 수교 거부 의지를 밝혔다.', '『고종실록』 8년', ['Gwangseongbo.JPG', '강화 광성보 안해루', 'Jjw / CC BY-SA 4.0']],
  ['반란', '임오군란', '1882년', '한양 (선혜청 일대)', false, 37.559, 126.976, '개항 후 정부는 신식 군대인 별기군을 우대한 반면 구식 군대 군인들에게는 13개월이나 급료를 주지 않았다. 1882년 6월 겨우 지급한 한 달 치 쌀마저 겨와 모래가 섞여 있고 양도 모자라자 분노한 군인들이 선혜청 당상 민겸호의 집을 습격했다. 군란에는 도시 하층민까지 가세해 일본 공사관을 공격하고 일본인 교관을 죽였으며, 궁궐로 쳐들어갔다. 흥선대원군이 다시 정권을 잡았으나 청이 군대를 보내 대원군을 톈진으로 끌고 갔고, 이후 청의 간섭이 커졌다.', '『고종실록』 19년', ["Portrait of Yi Haeung (National Museum of Korea).jpg", "흥선대원군 초상 (대체 사진)", "이한철·유숙 (추정) / 퍼블릭 도메인"]],
  ['기타', '갑신정변', '1884년', '우정총국 (서울 종로)', false, 37.5733, 126.9817, '김옥균·박영효·홍영식·서광범 등 급진 개화파는 청의 간섭과 민씨 세력에 맞서 개혁을 서둘렀다. 1884년 12월 4일 우정총국 개국 축하연에서 정변을 일으켜 민씨 정권 요인들을 살해하고 일본군의 지원을 받아 새 정부를 세웠다. 이들은 청에 대한 사대 폐지, 문벌 폐지와 인민 평등권 등을 담은 개혁 정강을 발표했으나, 청군이 개입하고 일본군이 철수하면서 사흘 만에 실패했다. 김옥균 등은 일본으로 망명했다.', '『고종실록』 21년; 김옥균 『갑신일록』', ['Central Post Office building, Seoul, 1893 (1) (26259287247).jpg', '서울 종로의 우정총국 건물', 'Richard Mortel / CC BY 2.0']],

  // 근현대
  ['반란', '동학농민운동 (고부 봉기)', '1894년', '고부 (정읍)', false, 35.62, 126.79, '전라도 고부 군수 조병갑은 만석보를 쌓으며 농민들을 강제로 동원하고 물세를 거두는 등 수탈을 일삼았다. 1894년 1월 동학 접주 전봉준이 농민들을 이끌고 고부 관아를 점령해 무기를 빼앗고 만석보를 허물었다. 사태 수습을 맡은 안핵사 이용태가 봉기 참여자를 탄압하자, 3월 전봉준·손화중·김개남 등이 무장에서 다시 일어나며 동학농민운동이 본격화했다. 농민군은 황토현과 황룡촌에서 관군을 무찌르고 전주성을 점령했다.', '『고종실록』 31년; 『전봉준 공초』', ["Jeon Bong-jun under arrest (27 February 1895).jpg", "압송되는 전봉준 (1895년)", "Murakami Tenshin (村上天眞) / 퍼블릭 도메인"]],
  ['반란', '우금치 전투', '1894년', '우금치 (공주)', false, 36.437, 127.107, '전주화약 이후 일본군이 경복궁을 점령하고 청일전쟁을 일으키자, 동학농민군은 일본을 몰아내기 위해 1894년 9월 다시 봉기했다. 전봉준의 남접과 손병희의 북접이 연합해 북상했고, 11월 공주 우금치에서 관군과 일본군 연합 부대와 맞섰다. 농민군은 여러 날 동안 수십 차례 고개를 넘으려 했지만, 신식 소총과 대포를 갖춘 일본군에게 큰 피해를 입고 패했다. 전봉준은 순창에서 붙잡혀 이듬해 처형되었다.', '『고종실록』 31년; 『주한일본공사관기록』', ["Donghak Peasant Revolution Foundation.jpg", "정읍 동학농민혁명기념관 (대체 사진)", "고려 / CC BY 4.0"]],
  ['기타', '을미사변', '1895년', '경복궁 건청궁', false, 37.586, 126.977, '청일전쟁 뒤 삼국 간섭으로 일본의 세력이 약해지자 고종과 명성황후는 러시아와 가까워지려 했다. 이에 일본 공사 미우라 고로는 1895년 10월 8일 새벽 일본군과 낭인들을 이끌고 경복궁에 침입해 건청궁에서 명성황후를 시해하고 시신을 불태웠다. 이 사건과 뒤이은 단발령에 분노한 유생들이 전국에서 을미의병을 일으켰고, 이듬해 고종은 러시아 공사관으로 거처를 옮겼다(아관파천).', '『고종실록』 32년; 『주한일본공사관기록』', ["Geoncheonggung gate.jpg", "경복궁 건청궁", "주식회사 아이티앤 / CC BY 4.0"]],
  ['기타', '을사늑약', '1905년', '덕수궁 중명전', false, 37.5655, 126.9726, '러일전쟁에서 이긴 일본은 1905년 11월 특사 이토 히로부미를 보내 대한제국의 외교권을 빼앗는 조약을 강요했다. 11월 17일 일본군이 덕수궁 중명전을 에워싼 가운데 회의가 열렸고, 고종은 끝내 동의하지 않았으나 이완용·박제순 등 다섯 대신(을사오적)의 찬성을 근거로 조약이 체결되었다고 발표되었다. 이로써 통감부가 설치되었고, 장지연은 「시일야방성대곡」을 써 이를 규탄했다.', '『고종실록』 42년; 『황성신문』 1905년 11월 20일자', ['Joongmyungjeon.jpg', '덕수궁 중명전 (복원)', 'Black207 / CC BY-SA 4.0']],
  ['기타', '안중근의 이토 히로부미 저격', '1909년', '하얼빈역', false, 45.76, 126.63, '대한의군 참모중장 안중근은 1909년 10월 26일 만주 하얼빈역에서 러시아 재무장관을 만나러 온 이토 히로부미를 권총으로 쏘아 죽였다. 현장에서 러시아 헌병에게 붙잡힌 그는 일본에 넘겨져 뤼순 법정에서 재판을 받았고, 1910년 3월 26일 뤼순 감옥에서 순국했다. 옥중에서 쓴 「동양평화론」은 미완성으로 남았으며, 그의 유해는 아직 찾지 못했다.', '안중근 『안응칠 역사』; 『동양평화론』; 뤼순 법정 공판 기록', ["An Jung-geun.JPG", "안중근 (1910년)", "작자 미상 / 퍼블릭 도메인"]],
  ['기타', '경술국치 (한일 병합 조약)', '1910년', '남산 통감 관저 터 (서울 중구)', false, 37.557, 126.988, '1910년 8월 22일 남산의 통감 관저에서 통감 데라우치 마사타케와 총리대신 이완용이 한일 병합 조약에 조인했다. 조약은 일주일 뒤인 8월 29일 공포되었고, 대한제국은 국권을 빼앗겼다. 순종은 병합을 알리는 조칙에 서명하지 않았다. 통감 관저가 있던 자리에는 지금 ‘통감관저 터’ 표석과 일본군 ‘위안부’ 기억의 터가 조성되어 있다.', '『순종실록』 3년; 한국병합에 관한 조약 원문', ["Japan–Korea Annexation Treaty 2.jpg", "한일 병합 조약 문서", "일본 정부·대한제국 / 퍼블릭 도메인"]],
  ['기타', '3·1 운동', '1919년', '탑골공원 (서울 종로)', false, 37.5712, 126.9882, '고종의 갑작스러운 죽음과 민족 자결주의의 영향 속에, 1919년 3월 1일 민족 대표 33인은 태화관에서 독립선언서를 낭독했다. 같은 시각 탑골공원에서는 학생과 시민들이 독립선언서를 읽고 만세 시위를 시작했다. 만세 운동은 곧 전국과 해외로 번져 수개월간 이어졌고, 일제의 무력 진압으로 수많은 사람이 죽거나 다쳤다. 3·1 운동은 그해 4월 상하이에서 대한민국 임시정부가 세워지는 계기가 되었다.', '「기미독립선언서」; 박은식 『한국독립운동지혈사』(1920)', ['Korea-Seoul-Tapgol Pavilion Park 0094-06.JPG', '탑골공원 팔각정', 'Steve46814 / CC BY-SA 3.0']],
  ['전쟁', '봉오동 전투', '1920년', '봉오동 (지린성 투먼 일대)', true, 43.03, 129.83, '3·1 운동 이후 만주의 독립군은 국경을 넘어 일본군을 공격했다. 1920년 6월 일본군이 독립군을 쫓아 두만강을 건너오자, 홍범도의 대한독립군은 최진동의 군무도독부, 안무의 국민회군 등과 연합해 봉오동 골짜기로 일본군을 끌어들인 뒤 사방에서 공격해 큰 승리를 거두었다. 대한민국 임시정부 기관지 『독립신문』은 일본군 157명이 죽었다고 보도했다.', '『독립신문』(상하이) 1920년 보도', ["Hong Beom-do 1921.jpg", "홍범도 (1921년)", "작자 미상 / 퍼블릭 도메인"]],
  ['전쟁', '청산리 전투', '1920년', '청산리 (지린성 허룽 일대)', true, 42.55, 128.75, '봉오동 전투 이후 일본은 훈춘 사건을 일으켜 대규모 병력을 만주로 보냈다. 1920년 10월 21일부터 6일간 김좌진이 이끄는 북로군정서와 홍범도의 대한독립군 등은 허룽현 청산리 일대의 백운평, 완루구, 어랑촌, 천수평 등에서 10여 차례 일본군과 싸워 크게 이겼다. 독립군 최대의 승리로 꼽히지만, 이후 일본군은 보복으로 간도의 한인 마을을 학살했다(간도 참변).', '『독립신문』(상하이) 1920년 보도', ["Battle of Qingshanli.JPG", "청산리 전투에서 독립군이 노획한 일본군 무기", "작자 미상 / 퍼블릭 도메인"]],
  ['기타', '제주 4·3', '1948년', '제주도 전역 (표시: 제주4·3평화공원)', true, 33.452, 126.618, '1947년 3월 1일 제주의 3·1절 기념 대회에서 경찰의 발포로 주민 6명이 숨진 뒤, 경찰·서북청년회의 탄압과 주민 반발이 이어졌다. 1948년 4월 3일 남조선노동당 제주도당 무장대가 단독 선거 반대 등을 내걸고 경찰지서 등을 습격했다. 이후 1954년 9월 한라산 금족 지역이 풀릴 때까지 진압 과정에서 수많은 주민이 희생되었다. 정부 진상조사보고서(2003)는 희생자를 2만 5천~3만 명으로 추정했고, 같은 해 대통령이 국가 권력의 잘못에 대해 공식 사과했다.', '제주4·3사건진상규명및희생자명예회복위원회 『제주4·3사건 진상조사보고서』(2003)', ["Jeju 4.3 Peace Park - Memorial Monument.jpg", "제주4·3평화공원", "GtDX8NNO3Efn2oF6q0s3 / CC BY-SA 4.0"]],
  ['반란', '여수·순천 10·19 사건', '1948년', '여수 (제14연대 주둔지)', false, 34.76, 127.66, '1948년 10월 19일 여수에 주둔하던 국군 제14연대의 일부 군인들이 제주 4·3 진압 출동 명령을 거부하며 봉기했다. 이들은 여수와 순천을 장악하고 인근 지역으로 세력을 넓혔으나 정부군에게 일주일여 만에 진압되었다. 진압 과정에서 봉기군에 협력했다는 이유로 많은 민간인이 재판 없이 희생되었다. 이 사건 이후 국가보안법이 제정되었고, 2021년 여순사건 특별법이 제정되어 진상 규명이 진행되고 있다.', '진실·화해를위한과거사정리위원회 진실규명결정(2009); 여순사건 특별법(2021)', ["Korea-Yeosu-Harbor-01.jpg", "여수항 (대체 사진)", "by lwy / CC BY 2.0"]],
  ['전쟁', '인천상륙작전', '1950년', '인천 월미도', false, 37.475, 126.598, '6·25 전쟁 초기 북한군은 낙동강 선까지 내려왔다. 유엔군 사령관 맥아더는 조수 간만의 차가 크고 수로가 좁아 상륙이 어렵다는 반대를 무릅쓰고 인천 상륙을 감행했다. 1950년 9월 15일 새벽 월미도를 먼저 점령한 뒤 인천에 상륙했고, 9월 28일 서울을 되찾았다. 이 작전으로 북한군의 보급로가 끊기며 전세가 뒤집혔다.', '국방부 군사편찬연구소 『6·25전쟁사』', ["Lopez scaling seawall.jpg", "인천 상륙 때 방파제를 넘는 미 해병 (1950년)", "미 해병대 / 퍼블릭 도메인"]],
  ['전쟁', '장진호 전투', '1950년', '장진호 (함남 개마고원)', false, 40.48, 127.25, '유엔군이 압록강 근처까지 북진한 1950년 11월 말, 중국군 여러 사단이 개마고원의 장진호 일대에서 미 제1해병사단 등을 포위했다. 영하 30도 안팎의 혹한 속에서 유엔군은 11월 27일부터 12월 11일까지 포위망을 뚫고 흥남까지 철수했다. 양측 모두 큰 피해를 입었으며, 중국군의 남진이 늦춰진 덕분에 흥남 철수 작전으로 군인과 피란민 약 20만 명이 바다로 빠져나갈 수 있었다.', '국방부 군사편찬연구소 『6·25전쟁사』', ["1st Marine Division at Chosin Reservoir in Korea, December 1950.jpg", "장진호 전투 중의 미 제1해병사단 (1950년)", "미 해병대 / 퍼블릭 도메인"]],
  ['기타', '정전협정 체결', '1953년', '판문점', false, 37.956, 126.677, '1951년 7월 시작된 정전 회담은 포로 송환 문제 등으로 2년 넘게 이어졌다. 1953년 7월 27일 오전 10시 판문점에서 유엔군 측 대표 해리슨과 북한·중국 측 대표 남일이 정전협정에 서명했고, 그날 밤 10시 전선의 포성이 멈췄다. 협정에 따라 군사분계선과 비무장지대가 설정되었다. 대한민국 정부는 휴전에 반대해 서명하지 않았으며, 협정은 지금까지 평화 협정으로 바뀌지 않았다.', '「한국 군사정전에 관한 협정」 원문; 국방부 군사편찬연구소 『6·25전쟁사』', ['UN honour guard outside armistice building at Panmunjom.jpg', '1953년 판문점 정전협정 조인 건물 앞의 유엔군 의장대', 'Donald Douglas George Bushby / 퍼블릭 도메인']],
  ['기타', '4·19 혁명', '1960년', '서울 세종로 (경무대 앞)', false, 37.572, 126.977, '1960년 3월 15일 정·부통령 선거에서 이승만 정부와 자유당은 사전 투표, 공개 투표 등 대규모 부정을 저질렀다. 마산에서 항의 시위가 일어났고, 4월 11일 실종됐던 고등학생 김주열의 시신이 최루탄이 박힌 채 마산 앞바다에서 발견되자 시위가 전국으로 번졌다. 4월 19일 서울에서 시위대가 경무대로 향하자 경찰이 발포해 많은 사람이 숨졌다. 4월 25일 대학교수단의 시위에 이어 4월 26일 이승만 대통령이 하야를 발표했다.', '국가기록원 4·19혁명 기록; 한국민족문화대백과사전', ["사월 희생 혁명 기념탑 April Revolution Monument.jpg", "국립4·19민주묘지 기념탑", "RyuMinjoo / CC BY-SA 4.0"]],
  ['반란', '12·12 군사반란', '1979년', '육군참모총장 공관 (서울 한남동)', false, 37.535, 127.005, '10·26 사건으로 박정희 대통령이 숨진 뒤 합동수사본부장을 맡은 보안사령관 전두환은 노태우 등 하나회 중심의 군인들과 함께 1979년 12월 12일 밤, 대통령 재가 없이 계엄사령관 정승화 육군참모총장을 한남동 공관에서 강제로 연행했다. 이를 막으려던 장태완 수도경비사령관 등의 저항을 무력으로 누르고 군권을 장악했다. 이들 신군부는 이후 5·17 비상계엄 확대로 정권을 잡았다. 1997년 대법원은 이 사건을 군사 반란으로 판결했다.', '대법원 전원합의체 판결(1997. 4. 17.)', ["Choi Kyu Ha.png", "최규하 (12·12 당시 대통령) (대체 사진)", "작자 미상 / 퍼블릭 도메인"]],
  ['기타', '5·18 민주화운동', '1980년', '광주 (옛 전남도청)', false, 35.146, 126.919, '1980년 5월 17일 신군부가 비상계엄을 전국으로 확대하고 민주 인사들을 체포하자, 18일 광주에서 학생들의 항의 시위가 일어났다. 공수부대가 시위대와 시민을 무자비하게 진압하자 시민들이 맞서 싸웠고, 21일에는 옛 전남도청 앞에서 계엄군이 집단 발포했다. 시민군은 계엄군을 일시 몰아내고 자치를 이루었으나, 27일 새벽 계엄군이 도청을 다시 장악하며 끝났다. 5·18 민주화운동 기록물은 2011년 유네스코 세계기록유산에 등재되었다.', '5·18민주화운동진상규명조사위원회 조사 결과; 5·18기념재단 자료', ["Korea-Gwangju-The former South Jeolla provincial office building-01A.jpg", "광주 옛 전남도청", "kaya / CC BY-SA 3.0"]],
  ['기타', '6월 민주항쟁', '1987년', '서울 (명동성당 일대)', false, 37.5633, 126.9873, '1987년 1월 서울대생 박종철이 경찰 조사 중 고문으로 숨진 사실이 드러났고, 4월 전두환 대통령은 대통령 간선제를 유지하겠다는 4·13 호헌 조치를 발표했다. 6월 9일 연세대생 이한열이 시위 중 최루탄에 맞아 쓰러지자 분노는 더 커졌다. 6월 10일부터 전국에서 "호헌 철폐, 독재 타도"를 외치는 시위가 이어졌고, 명동성당 농성 등이 시민들의 지지를 받았다. 결국 6월 29일 노태우 민정당 대표가 대통령 직선제 개헌을 약속하는 6·29 선언을 발표했다.', '민주화운동기념사업회 『한국민주화운동사』', ["고 이한열 추모 군중.jpg", "이한열 추모 인파 (1987년)", "서울특별시청 / 공공누리 제1유형"]],
  ['사고', '성수대교 붕괴', '1994년', '성수대교 (서울)', false, 37.537, 127.035, '1994년 10월 21일 오전 7시 40분경, 서울 성수대교의 10번과 11번 교각 사이 상판 약 48m가 한강으로 무너져 내렸다. 출근·등교 시간이라 버스와 승용차가 함께 추락해 무학여고 학생 등 32명이 숨지고 17명이 다쳤다. 조사 결과 부실한 용접 등 시공 결함과 과적 차량 통행, 부실한 유지 관리가 원인으로 밝혀졌다. 이 사고를 계기로 「시설물의 안전관리에 관한 특별법」이 제정되었다.', '한국민족문화대백과사전; 서울특별시 사고 조사 자료', ["1994성수대교 붕괴 사고17.jpg", "무너진 성수대교 (1994년)", "최광모 / CC BY-SA 4.0"]],
  ['사고', '삼풍백화점 붕괴', '1995년', '서울 서초동', false, 37.4995, 127.0075, '1995년 6월 29일 오후 5시 57분경, 서울 서초동 삼풍백화점 A동이 순식간에 무너져 내렸다. 502명이 숨지고 937명이 다쳤으며 6명이 실종되었다. 원래 아파트 상가로 설계된 건물을 백화점으로 바꾸면서 기둥을 줄이고 옥상에 무거운 냉각탑을 올리는 등 무리한 설계 변경과 부실 시공이 원인이었다. 붕괴 조짐이 몇 시간 전부터 있었지만 영업을 계속해 피해가 커졌다. 6·25 전쟁 이후 가장 많은 인명 피해를 낸 사고로 꼽힌다.', '서울특별시 『삼풍백화점 붕괴사고 백서』(1996)', ["1995년 6월 29일 삼풍백화점 붕괴 사고 4.jpg", "붕괴 현장 (1995년)", "서울소방재난본부 / CC BY-SA 4.0"]],
  ['사고', '대구 지하철 화재', '2003년', '중앙로역 (대구)', false, 35.8703, 128.594, '2003년 2월 18일 오전 9시 53분경, 대구 지하철 1호선 중앙로역에 정차한 전동차 안에서 한 남성이 휘발유에 불을 붙였다. 불은 순식간에 전동차로 번졌고, 반대편에서 들어온 전동차까지 옮겨 붙었다. 이 전동차의 기관사가 마스터키를 뽑아 탈출하면서 문이 닫힌 채 많은 승객이 빠져나오지 못했다. 192명이 숨지고 151명이 다쳤으며, 이후 전동차 내장재를 불연재로 바꾸는 등 안전 기준이 강화되었다.', '대구광역시 『2·18 대구지하철 중앙로역 화재참사 백서』(2005)', ["2003년 2월 대구광역시 대구 지하철 화재 참사 열차 내부 사진 Daegumetrofire02.jpg", "불탄 전동차 내부 (2003년)", "최광모 / CC BY-SA 4.0"]],

map.createPane('terrLabel').style.zIndex = 620; // 마커(600) 위: 이름표가 가려지지 않게(클릭은 통과)
const terrLayer = L.layerGroup().addTo(map);
let terrSlice;
function drawTerr(y) {
  const s = y == null ? null : TERR.s.find(t => t[0] <= y && y < t[1]);
  if (s === terrSlice) return;
  terrSlice = s;
  terrLayer.clearLayers();
  for (const [name, color, icon, gi, lab] of s ? s[2] : []) {
    const key = name.split(' (')[0];
    L.geoJSON({ type: 'MultiPolygon', coordinates: TERR.g[gi] }, {
      pane: 'terr', style: { color: '#555', weight: .8, opacity: .4, fillColor: color, fillOpacity: .18 }
    })
      .on('click', () => showCountry(key, icon, color))
      .on('mouseover', e => e.layer.setStyle({ weight: 1.8, fillOpacity: .3 }))
      .on('mouseout', e => e.layer.setStyle({ weight: .8, fillOpacity: .18 }))
      .addTo(terrLayer);
    if (lab) L.marker([lab[1], lab[0]], { pane: 'terrLabel', interactive: false, keyboard: false, icon: L.divIcon({
      className: 'terr-label', iconSize: null, html: `<span>${icon ? `<img src="${photo(icon, 64)}" alt="">` : ''}${name}</span>`
    }) }).addTo(terrLayer);
  }
}

  '진한': ['기원전 2세기경 ~ 4세기', '경상도 동부', '12개 소국으로 이루어진 연맹이다. 그 가운데 경주의 사로국이 성장해 신라가 되었다.', ''],
  '변한': ['기원전 2세기경 ~ 1세기', '경상도 남부 낙동강 하류', '12개 소국으로 이루어진 연맹이다. 철이 많이 나서 낙랑과 왜에 수출했으며, 뒤에 가야 연맹으로 발전했다.', ''],
  '고구려': ['기원전 37년 ~ 668년', '졸본 → 국내성(3) → 평양(427) → 장안성(586)', '주몽이 세운 나라로 만주와 한반도 북부를 무대로 성장했다. 광개토대왕과 장수왕 때 전성기를 맞아 요동과 한강 유역까지 차지했고, 수·당의 대군을 여러 차례 물리쳤다. 668년 나당연합군에 멸망했다.', '상징색은 알려져 있지 않다. 고분 벽화와 장식에 해를 상징하는 세 발 까마귀(삼족오)가 자주 등장해 이를 상징물로 썼다.'],
  '백제': ['기원전 18년 ~ 660년', '위례성(한성) → 웅진(475) → 사비(538)', '온조가 한강 유역에 세운 나라다. 4세기 근초고왕 때 전성기를 맞았고, 중국 남조·왜와 활발히 교류하며 세련된 문화를 꽃피웠다. 660년 나당연합군에 멸망했다.', '상징색은 알려져 있지 않아 백제 공예의 정수로 꼽히는 금동대향로를 상징물로 썼다.'],
  '신라': ['기원전 57년 ~ 935년', '금성 (경주)', '사로국에서 출발해 진흥왕 때 한강 유역을 차지하며 크게 성장했다. 당과 연합해 백제·고구려를 무너뜨리고 676년 삼국을 통일했다. 9세기 이후 왕위 다툼과 호족의 성장으로 쇠퇴하다 935년 고려에 항복했다.', '상징색은 알려져 있지 않아 신라를 대표하는 금관을 상징물로 썼다.'],
  '가야': ['42년(전승) ~ 562년', '김해(금관가야) · 고령(대가야)', '낙동강 하류 변한 지역의 소국들이 이룬 연맹이다. 철이 풍부해 덩이쇠를 화폐처럼 썼고 왜와 활발히 교역했다. 전기에는 금관가야, 후기에는 대가야가 이끌었으나 하나의 왕국으로 통합되지 못하고 562년 신라에 흡수되었다.', '상징색은 알려져 있지 않아 가야 금동관을 상징물로 썼다.'],
  '탐라': ['? ~ 1105년', '제주', '제주도에 있던 독자적인 나라로 백제·신라·고려에 조공했다. 1105년 탐라군이 되어 고려의 지방 행정 구역에 편입되었지만, 성주·왕자 칭호는 조선 초까지 이어졌다.', ''],
  '낙랑군': ['기원전 108년 ~ 313년', '평양 일대', '고조선 멸망 뒤 한이 그 땅에 둔 군현 가운데 가장 오래 남은 곳이다. 중국 문화가 한반도로 들어오는 통로였으나 313년 고구려 미천왕에게 쫓겨났다.', '그 시기 중국 왕조(한·위·진)의 상징색으로 칠했다.'],
  '발해': ['698년 ~ 926년', '동모산 → 중경 → 상경 → 동경 → 상경', '고구려 장수 출신 대조영이 고구려 유민과 말갈인을 이끌고 세운 나라다. 선왕 때 해동성국이라 불릴 만큼 번성했으며, 일본에 보낸 국서에서 고구려를 계승했다고 밝혔다. 926년 거란에 멸망했다.', '상징색은 알려져 있지 않아 정효공주묘 벽화의 인물을 상징물로 썼다.'],
  '후백제': ['900년 ~ 936년', '완산주 (전주)', '견훤이 세운 나라로 후삼국 가운데 군사력이 가장 강했다. 견훤과 아들 신검의 갈등 끝에 936년 고려에 멸망했다.', ''],
  '후고구려': ['901년 ~ 918년', '송악 → 철원(905)', '궁예가 고구려를 잇겠다며 세운 나라다. 국호를 마진(904), 태봉(911)으로 바꾸었으며, 918년 궁예가 쫓겨나고 왕건이 고려를 세웠다.', ''],
  '고려': ['918년 ~ 1392년', '개경 (1232~1270년은 강화)', '왕건이 세워 후삼국을 통일했다. 거란·여진·몽골의 침입을 겪으면서도 470여 년간 이어졌고, 고려청자·팔만대장경·금속활자 같은 문화유산을 남겼다. 영어 이름 Korea가 이 나라 이름에서 왔다.', '상징색은 알려져 있지 않아 고려청자(상감운학문 매병)를 상징물로 썼다.'],
  '조선': ['1392년 ~ 1897년', '한양 (한성)', '이성계가 세운 유교 국가다. 세종 때 훈민정음을 만들었고, 임진왜란과 병자호란을 겪었다. 1897년 국호를 대한제국으로 바꾸었다.', '국가 상징색은 따로 없었다. 왕의 자리 뒤에 두던 일월오봉도를 상징물로 썼고, 1883년 국기로 정한 태극기를 그 뒤 시기에 붙였다.'],
  '대한제국': ['1897년 ~ 1910년', '한성 (경운궁)', '고종이 황제로 즉위하며 선포한 나라다. 광무개혁을 추진했으나 1905년 을사늑약으로 외교권을 빼앗기고 1910년 일본에 국권을 빼앗겼다.', '황제의 색인 황색을 상징색으로, 태극기를 국기로 썼다.'],
  '일본 제국': ['1868년 ~ 1945년', '도쿄', '메이지 유신 이후 근대 국가가 된 일본은 청일·러일전쟁을 거쳐 타이완(1895)과 한국(1910)을 식민지로 삼았다. 한반도는 조선총독부가 통치했다. 태평양 전쟁에서 패해 1945년 8월 항복했다.', '국기 일장기.'],
  '미군정': ['1945년 9월 ~ 1948년 8월', '서울', '광복 뒤 38도선 이남에 설치된 미국 육군의 군정이다. 1948년 8월 15일 대한민국 정부 수립으로 끝났다.', '당시 미국 국기(별 48개).'],
  '소련군정': ['1945년 8월 ~ 1948년 9월', '평양', '38도선 이북을 점령한 소련군의 통치다. 1948년 9월 조선민주주의인민공화국 수립으로 이어졌다.', '소련 국기.'],
  '대한민국': ['1948년 ~ 현재', '서울', '1948년 8월 15일 수립된 민주 공화국이다. 6·25 전쟁을 겪은 뒤 산업화와 민주화를 함께 이루었다.', '국기 태극기.'],
  '북한': ['1948년 ~ 현재', '평양', '1948년 9월 9일 수립된 조선민주주의인민공화국이다. 김일성·김정일·김정은으로 권력이 세습되어 왔다.', '국기 인공기.'],
  '쌍성총관부': ['1258년 ~ 1356년', '화주 (함경남도 금야)', '몽골이 고려 동북면 철령 이북에 둔 통치 기관이다. 1356년 공민왕이 무력으로 되찾았다.', '원의 상징색인 흰색으로 칠했다.'],
  '동녕부': ['1270년 ~ 1290년', '서경 (평양)', '최탄 등이 서경 일대를 들어 몽골에 투항하자 원이 설치한 기관이다. 1290년 고려에 돌려주었다.', '원의 상징색인 흰색으로 칠했다.'],
  '탐라총관부': ['1273년 ~ 1294년', '제주', '삼별초를 진압한 뒤 원이 제주에 둔 기관으로 말을 기르는 목장을 운영했다. 1294년 고려에 돌려주었다.', '원의 상징색인 흰색으로 칠했다.'],
  '한': ['기원전 202년 ~ 220년', '장안 → 낙양', '유방이 세운 중국 통일 왕조다. 무제 때 고조선을 멸망시키고 군현을 두었다. 한족·한자의 ‘한’이 이 나라 이름에서 왔다.', '오덕(五德) 가운데 후한 때 확정된 화덕(火德), 붉은색.'],
  '위': ['220년 ~ 265년', '낙양', '삼국 시대에 중국 북부를 차지한 나라다. 관구검을 보내 고구려 환도성을 함락했다(244).', '토덕(土德), 노란색.'],
  '오·촉': ['221·222년 ~ 263·280년', '건업 · 성도', '삼국 시대 강남의 오와 쓰촨의 촉한이다. 촉한은 263년 위에, 오는 280년 진에 멸망했다.', ''],
  '진(晉)': ['265년 ~ 316년', '낙양', '사마염이 세워 280년 삼국을 통일했으나, 팔왕의 난과 북방 민족의 침입으로 316년 무너졌다.', '금덕(金德), 흰색.'],
  '동진': ['317년 ~ 420년', '건강 (난징)', '서진이 무너진 뒤 강남으로 내려가 세운 나라다. 384년 백제에 불교를 전한 마라난타가 동진에서 왔다.', '진(晉)을 이었으므로 흰색.'],
  '오호십육국': ['304년 ~ 439년', '화북 각지', '흉노·선비·저·갈·강 다섯 민족이 화북에 세운 여러 나라가 다투던 시대다. 그 가운데 선비족의 전연은 342년 고구려 환도성을 함락하기도 했다.', ''],
  '남조': ['420년 ~ 589년', '건강 (난징)', '송·제·양·진 네 왕조가 강남에서 이어진 시대다. 백제와 활발히 교류해 무령왕릉에 남조 양식의 벽돌무덤이 보인다.', ''],
  '북위': ['386년 ~ 534년', '평성 → 낙양(494)', '선비족 탁발부가 세운 나라로 439년 화북을 통일했다. 효문제는 수도를 낙양으로 옮기고 한화 정책을 폈다.', '491년 수덕(水德)을 채택해 검은색.'],
  '북조': ['534년 ~ 581년', '업 · 장안', '북위가 동위·서위로 갈라진 뒤 북제·북주가 이어진 시대다. 북주를 이은 수가 589년 중국을 다시 통일했다.', ''],
  '수': ['581년 ~ 618년', '대흥성 (장안)', '남북조를 통일한 왕조다. 고구려를 네 차례 침공했으나 살수대첩 등에서 패했고, 무리한 원정과 대운하 공사로 곧 멸망했다.', '화덕(火德), 붉은색.'],
  '당': ['618년 ~ 907년', '장안', '이연이 세운 왕조로 동아시아 문화의 중심이었다. 신라와 연합해 백제·고구려를 멸망시키고 평양에 안동도호부를 두었으나, 신라의 저항으로 676년 요동으로 물러났다.', '토덕(土德), 노란색.'],
  '토번': ['7세기 초 ~ 842년', '라싸', '티베트 고원에 세워진 왕국으로 763년 당의 장안을 점령할 만큼 강성했다.', ''],
  '5대 10국': ['907년 ~ 979년', '개봉 등', '당 멸망 뒤 화북의 다섯 왕조와 강남·쓰촨 등의 열 나라가 다투던 시대다. 송이 다시 통일했다.', ''],
  '요': ['916년 ~ 1125년', '상경 임황부', '거란족 야율아보기가 세운 나라다. 926년 발해를 멸망시키고 세 차례 고려를 침입했으나 귀주대첩 등에서 패했다. 여진의 금에 멸망했다.', '수덕(水德), 검은색.'],
  '송': ['960년 ~ 1127년', '개봉', '조광윤이 세운 왕조로 문치주의를 펴 경제·문화가 발달했으며 고려와 활발히 교류했다. 1127년 금에 수도를 빼앗기고 강남으로 옮겼다.', '화덕(火德), 붉은색.'],
  '남송': ['1127년 ~ 1279년', '임안 (항저우)', '금에 밀려 강남으로 옮긴 송이다. 1279년 원에 멸망했다.', '화덕(火德), 붉은색.'],
  '금': ['1115년 ~ 1234년', '상경 회령부 → 중도(베이징) → 개봉', '여진족 아구다가 세운 나라다. 요와 북송을 멸망시키고 고려에 사대를 요구했다. 1234년 몽골에 멸망했다.', '1202년 토덕(土德)을 채택해 노란색.'],
  '몽골 제국': ['1206년 ~ 1271년', '카라코룸', '칭기즈 칸이 세운 유목 제국으로 유라시아 대부분을 정복했다. 1231년부터 30년 가까이 고려를 침입했다.', '칭기즈 칸의 흰 깃발(차강 투그)처럼 몽골이 신성하게 여긴 흰색.'],
  '원': ['1271년 ~ 1368년', '대도 (베이징)', '쿠빌라이가 국호를 원이라 한 몽골의 왕조다. 고려를 부마국으로 삼아 내정에 간섭했고, 두 차례 일본 원정에 고려군을 동원했다.', '몽골의 흰색.'],
  '북원': ['1368년 ~ 1635년', '몽골 고원', '명에 밀려 몽골 고원으로 물러난 원 왕실과 그 뒤를 이은 몽골 정권이다. 1635년 마지막 칸의 아들이 후금에 항복했다.', '몽골의 흰색.'],
  '명': ['1368년 ~ 1644년', '난징 → 베이징(1421)', '주원장이 세운 한족 왕조다. 조선과 사대 관계를 맺었고 임진왜란 때 원군을 보냈다. 1644년 이자성의 난으로 멸망했다.', '흔히 화덕(火德), 붉은색으로 여겨진다.'],
  '여진': ['10세기 ~ 17세기 초', '만주 각지', '만주에 흩어져 살던 퉁구스계 민족이다. 금을 세웠고, 금 멸망 뒤 다시 흩어졌다가 누르하치가 통합해 후금을 세웠다.', ''],
  '후금': ['1616년 ~ 1636년', '허투알라 → 랴오양 → 선양(1625)', '누르하치가 여진을 통합해 세운 나라다. 1627년 조선을 침입했고(정묘호란), 1636년 국호를 청으로 바꾸었다.', ''],
  '청': ['1636년 ~ 1912년', '선양 → 베이징(1644)', '만주족이 세운 마지막 중국 왕조다. 병자호란으로 조선을 굴복시켰고 1644년 베이징에 들어가 중국을 지배했다. 청일전쟁 패배 뒤 조선에 대한 종주권을 잃었고 1912년 신해혁명으로 무너졌다.', '노란 바탕의 황룡기(1862년 이후 국기).'],
  '할하 몽골': ['1635년 ~ 1691년', '몽골 고원 북부', '북원 이후 몽골 고원 북부의 할하 부족들이다. 1691년 청에 복속했다.', ''],
  '복드 칸국': ['1911년 ~ 1924년', '후레 (울란바토르)', '신해혁명 때 청에서 독립을 선언한 몽골이다.', ''],
  '몽골 인민공화국': ['1924년 ~ 1992년', '울란바토르', '소련의 지원으로 세워진 사회주의 국가다.', '당시 국기.'],
  '몽골': ['1992년 ~ 현재', '울란바토르', '민주화 이후 새 헌법으로 출범한 몽골국이다. 1990년 대한민국과 수교했다.', '국기.'],
  '중화민국': ['1912년 ~ 현재 (1949년부터 타이완)', '난징 · 베이징', '신해혁명으로 세워진 공화국으로 대한민국 임시정부를 지원했다. 1949년 국공 내전에서 패해 타이완으로 옮겼다.', '1912~1928년 오색기, 1928년부터 청천백일만지홍기.'],
  '만주국': ['1932년 ~ 1945년', '신징 (창춘)', '일본 관동군이 만주를 점령한 뒤 청의 마지막 황제 푸이를 내세워 세운 괴뢰 국가다. 1945년 소련의 참전으로 무너졌다.', '국기.'],
  '중화인민공화국': ['1949년 ~ 현재', '베이징', '국공 내전에서 이긴 중국 공산당이 세운 나라다. 6·25 전쟁에 참전했으며 1992년 대한민국과 수교했다.', '국기 오성홍기.'],
  '흉노': ['기원전 3세기 ~ 1세기', '몽골 고원', '몽골 고원의 유목 제국이다. 묵특 선우 때 크게 일어나 기원전 200년 한 고조를 포위하는 등 한을 위협했다.', ''],
  '선비': ['1세기 ~ 3세기', '몽골 고원', '흉노가 물러난 뒤 몽골 고원을 차지한 유목 민족이다. 뒤에 전연·북위 등을 세웠다.', ''],
  '유목 부족': ['', '몽골 고원', '강력한 통일 세력 없이 여러 유목 부족이 나뉘어 있던 시기다.', ''],
  '유연': ['402년 ~ 555년', '몽골 고원', '몽골 고원의 유목 국가로 북위와 맞섰다. 돌궐에 멸망했다.', ''],
  '돌궐': ['552년 ~ 744년', '몽골 고원 (외튀켄)', '튀르크계 유목 제국이다. 607년 수 양제가 돌궐을 찾았을 때 고구려 사신이 와 있어 수를 긴장시켰다. 630년 당에 무너졌다가 682년 다시 일어났다.', ''],
  '위구르': ['744년 ~ 840년', '오르두발릭', '돌궐을 무너뜨리고 몽골 고원을 차지한 튀르크계 유목 국가다. 안사의 난 때 당을 도왔고, 840년 키르기스에 멸망했다.', ''],
  '몽골 부족': ['12세기', '몽골 고원', '요 멸망 뒤 몽골 고원의 여러 부족이 다투던 시기다. 테무친이 이들을 통합해 1206년 칭기즈 칸이 되었다.', ''],
  '숙신·읍루': ['고대', '만주 동북부', '만주 동북부의 수렵·어로 민족으로, 뒤의 말갈·여진의 조상으로 여겨진다.', ''],
  '말갈': ['6세기 ~ 10세기', '만주 동부', '만주 동부의 퉁구스계 민족이다. 일부는 고구려·발해에 속했고, 흑수말갈 등은 발해와 따로 움직였다. 뒤에 여진으로 이어졌다.', ''],
  '시베리아 원주민': ['', '시베리아·연해 지역', '러시아인이 오기 전 시베리아와 연해 지역에 살던 에벤키·니브흐 등 여러 민족이다.', ''],
  '러시아 차르국': ['1547년 ~ 1721년', '모스크바', '모스크바 대공국에서 발전한 나라로, 17세기 시베리아를 가로질러 1639년 오호츠크해에 이르렀다. 1654년과 1658년 나선정벌 때 조선 조총군이 청을 도와 흑룡강 일대에서 러시아군과 싸웠다.', ''],
  '러시아 제국': ['1721년 ~ 1917년', '상트페테르부르크', '표트르 대제가 선포한 제국이다. 1860년 베이징 조약으로 연해주를 얻어 조선과 국경을 맞댔고, 아관파천(1896)과 러일전쟁(1904~1905)으로 한국사에 깊이 관여했다.', '흰색·파랑·빨강 삼색기.'],
  '소련': ['1922년 ~ 1991년 (1917년 러시아 혁명)', '모스크바', '러시아 혁명으로 세워진 사회주의 국가다. 1937년 연해주 고려인을 중앙아시아로 강제 이주시켰고, 1945년 한반도 북부를 점령했다. 1990년 대한민국과 수교했다.', '국기.'],
  '러시아': ['1991년 ~ 현재', '모스크바', '소련 해체 뒤의 러시아 연방이다.', '국기.'],
  '왜': ['~ 7세기', '야마토 (나라 분지)', '일본 열도의 여러 소국과 야마토 정권이다. 백제와 가까워 불교·한자 등을 받아들였고, 663년 백강 전투에서 백제 부흥군을 도왔다. 7세기 말 일본이라는 이름을 쓰기 시작했다.', ''],
  '일본': ['701년 ~ 1868년 / 1945년 ~ 현재', '나라·교토·가마쿠라·에도(도쿄)', '율령 국가가 된 뒤 헤이안·가마쿠라·무로마치·에도 시대로 이어졌다. 1592년 임진왜란을 일으켰고, 에도 시대에는 조선 통신사가 오갔다. 1945년 패전 뒤 새 헌법으로 오늘의 일본이 되었다.', '근대 이전은 가마쿠라 시대부터 천황가 문장인 국화문, 1945년 이후는 국기 일장기.'],
  '아이누': ['~ 1869년', '홋카이도 (에조)', '홋카이도·사할린·쿠릴 열도의 원주민이다. 1869년 일본이 에조를 홋카이도로 이름 바꾸고 편입했다.', ''],
  '류큐': ['~ 1429년', '오키나와', '오키나와에 여러 세력이 나뉘어 있던 시기(삼산 시대 등)다.', ''],
  '류큐 왕국': ['1429년 ~ 1879년', '슈리', '삼산을 통일한 쇼 왕조의 왕국이다. 조선·명·일본 사이 중계 무역으로 번영했고, 1879년 일본에 병합되어 오키나와현이 되었다.', '왕가 문장 히다리 미쓰도모에.'],
  '타이완 원주민': ['~ 1683년', '타이완', '17세기 네덜란드와 정성공 세력이 들어오기 전부터 타이완에 살던 오스트로네시아계 원주민이다. 1683년 청에 편입되었다.', ''],
};

const countryEl = document.getElementById('country');
function setCountryOpen(open) {
  document.body.classList.toggle('country-open', open);
  map.invalidateSize();
}
function showCountry(key, icon, color) {
  const [period, capital, desc, sym] = COUNTRY[key] ?? ['', '', '', ''];
  countryEl.innerHTML = `
    <button class="close" title="닫기">×</button>
    ${icon ? `<img class="c-img" src="${photo(icon, 400)}" alt="${key}의 상징">` : ''}
    <h2>${key}</h2>
    <dl>
      ${period ? `<dt>기간</dt><dd>${period}</dd>` : ''}
      ${capital ? `<dt>중심지</dt><dd>${capital}</dd>` : ''}
      <dt>지도 색</dt><dd><span class="swatch" style="background:${color}"></span></dd>
    </dl>
    <p>${desc}</p>
    ${sym ? `<p class="sym"><b>색·상징</b><br>${sym}</p>` : ''}
    <p class="note">지도의 영토 경계는 대략적입니다.</p>`;
  countryEl.querySelector('.close').onclick = () => setCountryOpen(false);
  countryEl.scrollTop = 0;
  setCountryOpen(true);
}
document.body.classList.add('terr-on');
document.getElementById('showTerr').onchange = e => {
  e.target.checked ? terrLayer.addTo(map) : terrLayer.remove();
  document.body.classList.toggle('terr-on', e.target.checked);
};

const layers = {};
for (const cat in CATS) layers[cat] = L.layerGroup().addTo(map);

// 오른쪽 위: 사건 설명
const detail = document.getElementById('detail');
const photo = (f, w = 640) => `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(f)}?width=${w}`;
let selected = null;
function select(m) {
  selected?.getElement()?.classList.remove('selected');
  selected = m;
  m?.getElement()?.classList.add('selected');
}

function showIntro() {
  detail.innerHTML = `<div class="intro">
    <p><b>지도에서 사건 마커를 누르면</b> 이곳에 자세한 설명과 출처가 나옵니다.</p>
    <p>아래 슬라이더로 시대를 넘기거나 ▶ 버튼을 눌러 사건이 시간순으로 나타나는 모습을 볼 수 있습니다.</p>
    <p>연도나 위치가 확실하지 않은 사건에는 ‘연도 추정’, ‘추정 위치’ 표시가 붙습니다.</p>
  </div>`;
}

function showDetail([cat, name, year, place, approx, , , desc, src, img]) {
  const flags = [!year ? '연대 미상' : year.includes('추정') && '연도 추정', approx && '추정 위치'].filter(Boolean);
  detail.innerHTML = `
    <button id="close" title="닫기">×</button>
    ${img ? `<figure><img src="${photo(img[0])}" alt="${img[1]}" loading="lazy">
        <figcaption>${img[1]}<br>사진: <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(img[0])}" target="_blank" rel="noopener">${img[2]}</a>, Wikimedia Commons</figcaption></figure>`
      : '<div class="nophoto">(사진 혹은 실물 기록 부재)</div>'}
    <span class="chip" style="--c:${CATS[cat]}">${cat}</span>
    <h2>${name}</h2>
    <dl>
      <dt>연도</dt><dd>${year ?? '연대 미상'}</dd>
      <dt>장소</dt><dd>${place}</dd>
      <dt>추정 여부</dt><dd>${flags.map(f => `<span class="flag">${f}</span>`).join('') || '없음'}</dd>
    </dl>
    <p class="desc">${desc}</p>
    <div class="src"><b>출처</b><br>${src.split('; ').join('<br>')}</div>`;
  detail.querySelector('#close').onclick = () => { select(null); showIntro(); };
  detail.scrollTop = 0;
}

const dated = [], undated = []; // 연도 있는 사건만 슬라이더 대상. 연대 미상은 슬라이더와 무관(고조선·삼국 시대로 분류)
for (const ev of EVENTS) {
  const [cat, name, year, , , lat, lng] = ev;
  const m = L.marker([lat, lng], {
    icon: L.divIcon({ className: 'pin-wrap', html: `<div class="pin" style="background:${CATS[cat]}"></div>`, iconSize: [36, 36] })
  })
    .bindTooltip(`${name} · ${year ? year.replace(/ \(.*\)/, '') : '연대 미상'}`, { direction: 'top', offset: [0, -14] })
    .on('click', () => { showDetail(ev); select(m); })
    // 슬라이더로 지웠다 다시 그리면 아이콘이 새로 생기므로 선택 표시 복원
    .on('add', () => m === selected && m.getElement().classList.add('selected'));
  if (year) dated.push({ m, cat, y: parseInt(year.match(/\d+/)) * (year.startsWith('기원전') ? -1 : 1) });
  else undated.push({ m, cat, y: -Infinity });
}
dated.sort((a, b) => a.y - b.y);

// 오른쪽 아래: 사건 유형 범례 겸 필터
const filters = document.getElementById('filters');
for (const cat in CATS) {
  const label = document.createElement('label');
  label.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:${CATS[cat]}"></span>${cat}
    <span class="count">${EVENTS.filter(e => e[0] === cat).length}</span>`;
  label.querySelector('input').onchange = e => { e.target.checked ? map.addLayer(layers[cat]) : map.removeLayer(layers[cat]); update(); };
  filters.append(label);
}
document.getElementById('summary').textContent = `사건 ${EVENTS.length}개 · 고조선부터 현대까지`;

// 타임 슬라이더: 값 k = 시간순으로 앞에서 k개 사건까지 표시
const slider = document.getElementById('slider'), playBtn = document.getElementById('play');
slider.max = dated.length; // max를 먼저 넣어야 value가 기본 max(100)에 잘리지 않는다
slider.value = dated.length;

// 시대 분류: 고른 시대의 사건만 표시
const ERAS = [['전체', -Infinity, Infinity], ['고조선·삼국', -Infinity, 676], ['남북국', 676, 936], ['고려', 936, 1392],
  ['조선', 1392, 1876], ['근대', 1876, 1945], ['현대', 1945, Infinity]];
let era = ERAS[0];
const eraBox = document.getElementById('eras');
for (const e of ERAS) {
  const b = document.createElement('button');
  b.textContent = e[0];
  b.classList.toggle('on', e === era);
  b.onclick = () => {
    era = e;
    for (const x of eraBox.children) x.classList.toggle('on', x === b);
    if (e !== ERAS[0]) slider.value = dated.filter(d => d.y < e[2]).length; // 그 시대 끝까지 보여 주기
    update();
  };
  eraBox.append(b);
}
const inEra = y => era[1] <= y && y < era[2];

const fmtYear = y => y < 0 ? `기원전 ${-y}년` : `${y}년`;

function update() {
  const k = +slider.value;
  drawTerr(k ? dated[k - 1].y : null);
  dated.forEach((d, i) => i < k && inEra(d.y) ? d.m.addTo(layers[d.cat]) : layers[d.cat].removeLayer(d.m));
  undated.forEach(d => inEra(d.y) ? d.m.addTo(layers[d.cat]) : layers[d.cat].removeLayer(d.m));
  const shown = Object.values(layers).filter(l => map.hasLayer(l)).reduce((n, l) => n + l.getLayers().length, 0);
  document.getElementById('info').textContent = `${k ? fmtYear(dated[k - 1].y) + '까지' : '시작 전'}${era === ERAS[0] ? '' : ` · ${era[0]}`} · 보이는 사건 ${shown}개`;
}

let timer = null;
function stop() { clearInterval(timer); timer = null; playBtn.textContent = '▶'; }
playBtn.onclick = () => {
  if (timer) return stop();
  if (+slider.value >= dated.length) slider.value = 0;
  playBtn.textContent = '⏸';
  update();
  timer = setInterval(() => {
    slider.value = +slider.value + 1;
    update();
    if (+slider.value >= dated.length) stop();
  }, 600);
};
slider.oninput = update;
showIntro();
update();
</script>
</body>
</html>
